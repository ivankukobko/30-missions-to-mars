<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a0c05" />
    <!--
      Run chromeless when launched from the home screen. The Fullscreen API needs a user
      gesture and iPhone Safari does not expose it at all, so a truly borderless tab in
      the browser is not on the table; added to the home screen, these drop the browser
      UI on both platforms. `black-translucent` lets the canvas run under the status bar,
      which `viewport-fit=cover` and the HUD's `env(safe-area-inset-*)` padding already
      account for.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="30 Missions to Mars" />
    <title>The Only Thing at the Bottom | 30 Missions to Mars</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-layer"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
