<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The SVG is the icon; the two PNGs are for the places that cannot read one.

      `apple-touch-icon` is not decoration here. The home-screen metas below make an
      installed launch a real path, and iOS with no touch icon declared renders a
      screenshot of the page instead — which for a game that boots into a canyon is a
      thumbnail of rock. 180 is the size iOS asks for; anything smaller it upscales.

      Hrefs stay absolute because `base: './'` rewrites them to `./` at build time, and
      that rewrite is what makes them resolve on the Pages project subpath and inside an
      itch iframe. Writing `./` here instead would survive the build and break `vite dev`.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a0c05" />
    <!--
      Run chromeless when launched from the home screen. The Fullscreen API needs a user
      gesture and iPhone Safari does not expose it at all, so a truly borderless tab in
      the browser is not on the table; added to the home screen, these drop the browser
      UI on both platforms. `black-translucent` lets the canvas run under the status bar,
      which `viewport-fit=cover` and the HUD's `env(safe-area-inset-*)` padding already
      account for.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="30 Missions to Mars" />
    <title>The Only Thing at the Bottom | 30 Missions to Mars</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-layer"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
