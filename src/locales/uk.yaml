campaign:
  defaultGoal: Приземлитися неушкодженим — де завгодно, аби вижити.
  missions:
    "1":
      payloadName: Реле UL-5
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Твоє реле стоїть на краю уступу і ми встановили канал зв'язку з тієї самої миті, як воно застигло. Одинадцять років ми тут, на дні. А це перший живий голос на цій хвилі.
    "2":
      payloadName: Навігаційний радар
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Сол 7347. Одинадцять років на цьому дні, і кожна заміряна нами відстань мала похибку. Сьогодні все зміниться.
        - sender: ФОРПОСТ ІКСІОН
          content: Ми — єдине, що є на дні цього каньйону, і ми маємо намір залишитися такими.
        - sender: ФОРПОСТ ІКСІОН
          content: Твоє реле запрацювало шість солів тому, і відтоді ми без упину замовляємо спорядження. Бурову установку, щоглу, колонковий бур. Роками ми вірили, що під цим дном є руда. Тепер ми нарешті зможемо це перевірити.
        - sender: ФОРПОСТ ІКСІОН
          content: Ти несеш наш навігаційний радар. Доки він не стане на ґрунт, у тебе немає ані висотоміра, ані пеленга, тож посади його де завгодно, але цілим.
        - sender: ФОРПОСТ ІКСІОН
          content: Місце, де він стане, стане точкою відліку. Кожне наше вимірювання відтепер спиратиметься на цю щоглу, а в нас її ніколи не було. Обери місце.<br/><br/><b>ЦІЛЬ</b> Приземлитися неушкодженим на відкритий ґрунт на дні каньйону.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Радар стоїть і вирівняний настільки, що сьогодні вночі ми відкалібруємо його за краєм каньйону. Відтепер кожне наше вимірювання починається звідти, де ти його посадив.
        strong: Ти виставив щоглу точніше за припуск, набагато жорсткіше за технічні вимоги. Відтепер кожне наше вимірювання починається звідти, де ти її поставив.
        weak: Він стоїть вертикально і відповідає — це все, що нам було потрібно. Відтепер кожне наше вимірювання починається звідти, де ти його посадив.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Ми бачимо тебе через реле і більше ніяк. Ані дальності, ані пеленга — усе це закріплено у тебе під днищем.
        - sender: ФОРПОСТ ІКСІОН
          content: Він має стояти суворо прямовисно і непорушно. Усе інше після цього — проста арифметика.
      goal: Приземлитися неушкодженим на відкритий ґрунт на дні каньйону.
    "3":
      payloadName: Зразки керна
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Радар підключено до твого каналу — висота, дальність і пеленг транслюються зі щогли, яку ти встановив учора. Наш майданчик теж позначений. Відтепер ти летиш на конкретну адресу, навігаторе.
        - sender: ФОРПОСТ ІКСІОН
          content: Перший аналіз готовий, і ми перевірили його чотири рази, бо ніхто не вірив. Дев'ять цілих чотири десятих відсотка, пласт два метри, і вглиб він не тоншає. Ми мали рацію щодо цього дна. Одинадцять років ми мали рацію.
        - sender: ВИДОБУТОК ГЕЛІОН
          content: СПРАВА 4471-C · ПОВІДОМЛЕННЯ ПРО ЗАЦІКАВЛЕНІСТЬ · АВТО<br/><br/>АНАЛІЗ РУДИ ПЕРЕХОПЛЕНО З ВІДКРИТОГО РЕЛЕ, КАНЬЙОН КОПРАТ.<br/>ЗАЯВОК НА ДІЛЯНКУ НЕ ЗАРЕЄСТРОВАНО.<br/>НАПРАВЛЕНО ГЕОЛОГОРОЗВІДКУ.
        - sender: ФОРПОСТ ІКСІОН
          content: Каньйон Копрат. Скоріше Каньйон Корпорат... Так, жарт не надто смішний.
        - sender: ФОРПОСТ ІКСІОН
          content: Народ тут називає тебе Навігатором. Ніхто не мав повноважень робити це офіційно, але прізвисько прижилося.<br/><br/><b>ЦІЛЬ</b> Доставити зразки керна на майданчик форпосту.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Керни доставлено до установки, і сьогодні вночі аналіз піде до офіційного журналу. Дев'ять цілих і чотири десятих відсотка, підтверджено чотири рази — тепер це число, з яким іншим доведеться рахуватися.
        strong: Керни знято з майданчика без пошкодження гермоукупорки, тож аналіз чинний. Дев'ять і чотири відсотка — тепер з цим числом доведеться рахуватися іншим.
        weak: Керни знято з майданчика, контейнери витримали, хоча на таке навантаження їх не розраховували. Дев'ять і чотири десятих відсотка, і тепер ми маємо докази.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Цей шурф у дні каньйону — наш. Пробитий там, де ми могли дістати, а не де залягала руда. Наступний ми поведемо прямо вниз.
        - sender: ФОРПОСТ ІКСІОН
          content: Наш майданчик — єдина позначена адреса в цьому каньйоні. Це ненадовго.
      goal: Доставити зразки керна на майданчик форпосту.
    "4":
      payloadName: Регенератор води
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Сьогодні вантаж важчий, навігаторе, і керувати апаратом буде важче, ніж вказують самі лише цифри маси. Ми вважаємо, справа в тому, як розподілена маса, а не скільки її. Звідси ми ніколи не мали змоги це виміряти.
        - sender: ФОРПОСТ ІКСІОН
          content: З минулого тижня на нашому радарі два транспондери. Обидва під тягою, обидва коригують курс на цей каньйон, сімнадцять солів до підльоту. Щогла, яку ти поставив — єдина причина, чому ми взагалі їх бачимо.
        - sender: ФОРПОСТ ІКСІОН
          content: Регенератор розрахований на сорок людей. Нас одинадцятеро. Ми продовжуємо замовляти на ту команду, яку сподіваємося зібрати до зими.
        - sender: ФОРПОСТ ІКСІОН
          content: "Апарат лишається тут, на дні — розберемо до останнього гвинтика і вмонтуємо у форпост, зливши баки. Саджай його важким, навігаторе: у команди плани на завтрашній вечір.<br/><br/><b>ЦІЛЬ</b> Доставити регенератор на майданчик форпосту."
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Регенератор на місці, і в команди плани на сьогоднішній вечір. Він розрахований на сорок душ. Нас одинадцятеро.
        strong: Посадка в межах одного метра від центру з такою масою на борту. У команди плани на сьогоднішній вечір.
        weak: Він внизу і цілий — це все, що було потрібно для баків. У команди плани на сьогоднішній вечір.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Вода — єдине, чого ми не можемо виробити тут, унизу. З усім іншим ми імпровізуємо.
        - sender: ФОРПОСТ ІКСІОН
          content: Дід Дейва клявся, що Обличчя в Кідонії хтось збудував. Дейв увесь наш перший місяць на орбіті фотографував його. Це була просто скеля.
      goal: Доставити регенератор на майданчик форпосту.
    "5":
      payloadName: Заявки на ділянки
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Сьогодні вранці на орбіту вийшли дві видобувні хартії. Геліон на захід від нас, Кесслер на схід. Жоден з них не проводив розвідки на підльоті. Вони перехопили наш аналіз із відкритого каналу і пішли просто вниз.
        - sender: ФОРПОСТ ІКСІОН
          content: Вони не розмовлятимуть ані один з одним, ані з нами. Статут хартій — жодної спільної розвідки, жодних спільних технологій, нічого через межу ділянки. Усе — корпоративна таємниця. Ми тримали канал відкритим. Так вони й знайшли цей пласт.
        - sender: ФОРПОСТ ІКСІОН
          content: Ми згаяли п'ятнадцять солів на вивчення гірничого права замість читання наукових журналів. Прилади працювали без упину весь цей час. Ніхто на них навіть не глянув. Такого не траплялося за всі одинадцять років.
        - sender: ФОРПОСТ ІКСІОН
          content: Ось як тут влаштовані права на ґрунт, навігаторе. Ти закріплюєш руду за собою, доки її копаєш, а не будуєш парканчик. Припинив роботу — право згасає. Позначив скелю, яку не довбаєш — це порожній звук.
        - sender: ФОРПОСТ ІКСІОН
          content: Тому ми подали заявку першими. Це їх не зупинить. Але це занесено до реєстру, а реєстр — єдине тут, унизу, що вони не зможуть викопати екскаватором.<br/><br/><b>ЦІЛЬ</b> Доставити документи на майданчик форпосту до посадки корпоративної геологорозвідки.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Заявку подано, і раніше за їхню розвідку. Це їх не зупинить. Але це в реєстрі, а реєстр — єдине тут унизу, чого вони не зможуть розкопати.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Сьогодні між нашим майданчиком і небом немає нічого. Скористайся цим сповна.
        - sender: ФОРПОСТ ІКСІОН
          content: Ти станеш єдиною ниткою, яка зв'язує нас усіх трьох. Ніхто цього не планував, і ніхто вже не зможе скасувати.
      goal: Доставити документи на майданчик форпосту до посадки корпоративної геологорозвідки.
    "6":
      payloadName: Бурова головка
      messages:
