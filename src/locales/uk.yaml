    "26":
      payloadName: Захисна оболонка
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Найважча річ, яку хтось будь-коли сюди доставляв. Від західної стіни аж до самісінького забою шахти, крізь усе, що нагородили обидві хартії — і бережи стіни. Усе, що падало в цей каньйон і ніколи не злетіло, тепер замуровано в них.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Канал форпосту мовчить уже дуже давно. Раніше там щозміни був рух. Мені просто ніколи цим перейматися.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Як тільки ми накриємо її ковпаком, я зможу закласти заряд під пласт і не втратити склепіння. Геліон рубає до нього вже рік і досі не дістався того, що лежить під нами.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Зроби все як слід. Нікому іншому я б це не довірив.<br/><br/><b>ЦІЛЬ</b> Доставити оболонку на ЗАБІЙ ШАХТИ.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Накрито й посаджено. Бувало, вантажі лягали значно гірше на той самий майданчик, і доводилося гнати бригаду рівняти їх ломами.
        strong: Сів з першого разу. У мене були машини, яким потрібно було три спроби на цей майданчик, і навіть це я зараховував за добру роботу.
        weak: Він унизу і тримається — це все, що вимагає майданчик. Я списував апарати, які не спромоглися й на це.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Бригаду піднято з забою, поки ти сідаєш. Під таким вантажем ніхто не працюватиме.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Вітер стихає, щойно перетинаєш край каньйону. Усе, що нижче — це подих самої безодні.
      goal: Доставити оболонку на ЗАБІЙ ШАХТИ.
    "27":
      payloadName: Архів кернів
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Сол 7905. Ми консервуємо форпост, навігаторе. Нас було одинадцятеро в перші дні; зараз менше. Усе, про що ми дізналися в цьому каньйоні, записано на цьому архіві — кожне зондування, кожен керн, калібрування радіощогли.
        - sender: ФОРПОСТ ІКСІОН
          content: Привези його додому востаннє, навігаторе.
        - sender: ФОРПОСТ ІКСІОН
          content: Радар лишається увімкненим. Ми залишаємо його заживленим — хартії можуть користуватися ним чи ні. Ти збережеш орієнтири й після того, як ми підемо. Це найменше, що ми могли зробити.<br/><br/><b>ЦІЛЬ</b> Повернути архів на майданчик форпосту.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Архів удома. Радар залишається заживленим — ти матимеш орієнтири й після нашого відходу. Це здавалося найменшим, що ми могли зробити.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Сол 7905. Нас було одинадцятеро в перші дні, навігаторе. Зараз менше.
        - sender: ФОРПОСТ ІКСІОН
          content: Усе, що ми дізналися про цей каньйон, лежить під тобою. Кожне зондування, кожен керн.
      goal: Повернути архів на майданчик форпосту.
