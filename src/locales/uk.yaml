      goal: Доставити заряди на МАЙДАНЧИК ГЕЛІОН.
    "13":
      payloadName: Кріплення шахти
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Масив слухав пласт цілий сезон. Щоночі та сама картина — глибше руда багатша, і щоразу більше дрібних поштовхів. Геліон прочитав те саме й зупинився, якщо там узагалі є кому читати. Ви двоє не родичі, бляшанко?
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Менше з тим. Це кріплення — останнє, що ти завозиш мені на поверхню. Відзавтра ми ведемо старий шурф Іксіона вниз. Справжню шахту, прямо крізь ту ямку, яку вони розколупали.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Найважчий вантаж із тих, що ти тягав для нас, а майданчик ширшим не став. Заходь рівно.<br/><br/><b>ЦІЛЬ</b> Доставити кріплення на МАЙДАНЧИК КЕССЛЕРА.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Останнє, що ти привіз мені на поверхню. Відзавтра ми ведемо стару розробку Іксіона вниз.
        strong: Рівно, з першого заходу, на майданчик, який не збільшився з минулого разу. Останнє, що ти доставив мені нагорі.
        weak: Він на майданчику, кріплення без тріщин — це єдине, що мало значення. Останній вантаж тут, нагорі.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Останній вантаж, який сідає для нас на поверхню. Після цього все піде в діру.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Перетнув увесь порожній космос, щоб дістатися сюди, і вся робота — копатися в багнюці. Знову. Ніхто про це не попереджає.
      goal: Доставити кріплення на МАЙДАНЧИК КЕССЛЕРА.
    "14":
      payloadName: Ядро екскаватора
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Стовбур відкрито. Поки що туди не пірнай. На дні ще немає на що сідати, а стіни не укріплені.
        - sender: ФОРПОСТ ІКСІОН
          content: Це наша стара виробка, яку він пробиває вниз, навігаторе. За чотириста метрів від нашої плити, і він ніколи не оформлював прав на цю землю.<br/><br/>Виконуй контракт. Ми не вимагаємо від тебе обирати сторону.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Ядро клади на майданчик, як завжди. Поглянь на діру, коли пролітатимеш повз, якщо хочеш. Мілкішою вона вже ніколи не буде.<br/><br/><b>ЦІЛЬ</b> Доставити ядро на МАЙДАНЧИК КЕССЛЕРА.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Ядро на майданчику. Завтра воно піде в шахту і більше не підніметься, як і все інше тут.
        strong: Сів з першого заходу. Діра сьогодні ще мілка, але груба посадка коштувала б мені тижня простою.
        weak: Внизу і тримається. На такій глибині стовбур ще прощає помилки. Далі так не буде.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Ця діра була іксіонівською, перш ніж стати чиєюсь. Ніхто не міг завадити нам забрати її, от ми й забрали.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Поглянь на неї, поки летиш повз. Мілкішою вона вже ніколи не буде.
      goal: Доставити ядро на МАЙДАНЧИК КЕССЛЕРА.
    "15":
      payloadName: Освітлення шахти
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Посадковий майданчик на дні стовбура готовий, уже глибоко під каньйоном, і стіни стискаються з обох боків.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Сьогодні нічого важкого, бляшанко. Це вже друга гірлянда, яку я замовляю для цієї шахти. Перша похована під породою, яку ми туди сипанули, і відтоді хлопці працюють з налобними ліхтарями.<br/><br/><b>ЦІЛЬ</b> Спуститися в шахту. Доставити на ГИРЛО ШАХТИ.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Світло на місці. Мої хлопці сиділи з налобними ліхтарями відтоді, як першу лінію завалило породою.
        strong: Вниз у стовбур і на майданчик з першого разу. Моя бригада ходила з ліхтариками цілий сезон.
        weak: Він унизу, дроти цілі — це все, що вимагається від світла. Сьогодні нарешті знімемо налобники.
