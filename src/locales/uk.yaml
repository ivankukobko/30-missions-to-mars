    "29":
      payloadName: Останній заряд
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Скоро рік у цій пащі, а вона все ще не наїлася нами. Вниз у стовбур, який почав розкопувати форпост, і кожен метр нижче тієї першої позначки ти поклав туди власноруч.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Сімсот кілограмів, точно як різальні заряди — ти вже літав із цим. Більше в цьому каньйоні нікого немає.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Форпост не евакуювався, навігаторе. Звідси ніхто не евакуюється. Я чув, як замовк їхній канал — один за одним, доки не залишилося нікого, хто міг би натиснути тангенту. Тож залишилися тільки ти, я і триста метрів—
        - sender: ФОРПОСТ ІКСІОН
          content: Ми — єдине, що є на дні цього каньйону, і ми маємо намір залишитися такими.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: —діри. Тягни його вниз.<br/><br/><b>ЦІЛЬ</b> Доставити заряд на ЗАБІЙ ШАХТИ.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Кожен метр під тим першим відтинком — це те, що ти посадив туди власноруч.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Усі бури зупинено. Тижнями в цьому каньйоні не було чути жодного звуку, крім твого чи мого.
      goal: Доставити заряд на ЗАБІЙ ШАХТИ.
  epilogue:
