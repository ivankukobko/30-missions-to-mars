        strong: "ПАРТІЯ 4471-C/596 · ДОСТАВЛЕНО<br/>ЕФЕКТИВНІСТЬ ПЕРЕВІЗНИКА: {CENTILE} ПРОЦЕНТИЛЬ<br/>ЛЮДСЬКОГО ФАКТОРА НЕ ВИЯВЛЕНО. КЛАСИФІКАЦІЯ: НА РОЗГЛЯДІ"
