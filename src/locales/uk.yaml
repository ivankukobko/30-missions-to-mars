      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Жоден бур унизу не працює. На шляху сюди ти не почуєш нічого, крім себе.
        - sender: ФОРПОСТ ІКСІОН
          content: Одинадцять років судових заяв, і дев'ять днів тиші — це все, що ми за них отримали.
      goal: Доставити скрубер додому на майданчик форпосту.
    "12":
      payloadName: Різальні заряди
      messages:
        - sender: ВИДОБУТОК ГЕЛІОН
          content: "КОНТРАКТ 4471-C/140 · РЕД 4 · АВТО<br/><br/>КЛАС АКТИВУ: ДИСТАНЦІЙНИЙ ВАНТАЖ / HD-7<br/>ПАРТІЯ: РІЗАЛЬНІ ЗАРЯДИ<br/>ПРИЗНАЧЕННЯ: МАЙДАНЧИК ГЕЛІОН<br/>НАКАЗ IXN-0071: СКАСОВАНО. РОБОТИ ВІДНОВЛЕНО."
        - sender: УМОВИ ПЕРЕВЕЗЕННЯ
          content: "ЗАРЯДИ ДЛЯ ГОРИЗОНТАЛЬНОГО БУРІННЯ. ГЕЛІОН ПРАЦЮЄ ВЗДОВЖ, А НЕ ВГЛИБ. ПРИЗУПИНЕНІ ПАРТІЇ ДОПУЩЕНО ДО МОНТАЖУ.<br/>ПАЛИВО: МІНІМАЛЬНО НЕОБХІДНЕ.<br/>ПОВЕРНЕННЯ ОЧІКУЄТЬСЯ: НІ<br/><br/><b>ЦІЛЬ</b> Доставити заряди на МАЙДАНЧИК ГЕЛІОН."
