    "10":
      payloadName: Вузлова лебідка
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Лебідку змонтують у той день, коли мені дозволять її до чогось прикрутити. Зараз ніхто не дозволяє. Цей припис вручили нам обом, і моя бригада сидить без діла.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Все одно вези її вниз, бляшанко. Контракт є контракт. На тому майданчику нічого не збудують, доки трибунал із запізненням на три місяці не дозволить мені її підняти.<br/><br/><b>ЦІЛЬ</b> Доставити лебідку на МАЙДАНЧИК КЕССЛЕРА.
