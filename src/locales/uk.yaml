        sender: КЕССЛЕР Г.Л.И.Б.
        content: Лежить на майданчику, де й залишиться, доки запізнілий на три місяці трибунал не дозволить мені її прикрутити.
        strong: Поклав акуратно й рівно, хоча для вантажу, який нікому не дозволено чіпати, це було й необов'язково. Але звичка хороша.
        weak: Вона внизу й ціла. Цього місяця з неї все одно нічого не побудують.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Моя бригада відсторонена, кожен бур у цьому каньйоні охолов. Ти — єдине, що тут рухається, бляшанко.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Ми могли б вирішити це в 'камінь, ножиці, папір'. У них папір, у мене камінь, а ножиць ні в кого немає.
      goal: Доставити лебідку на МАЙДАНЧИК КЕССЛЕРА.
    "11":
      payloadName: Скрубер атмосфери
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Дев'ять днів, навігаторе. Дев'ять днів у цьому каньйоні не гуркотів жоден бур, і можна було знову почути вітер.
        - sender: ФОРПОСТ ІКСІОН
