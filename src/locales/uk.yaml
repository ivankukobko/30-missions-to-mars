        - sender: ФОРПОСТ ІКСІОН
          content: Тож маємо запчастини. Найлегший вантаж, по який ми тебе колись посилали. Це не наша доброта — це точний розмір того, що залишилося на рахунку.<br/><br/><b>ЦІЛЬ</b> Доставити запчастини на майданчик форпосту.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Запчастини на місці. Найлегший вантаж із тих, що ми замовляли, і саме стільки грошей залишалося на рахунку.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Регенератор з перших днів відмовив. Він пережив свій ресурс на багато років.
        - sender: ФОРПОСТ ІКСІОН
          content: Колись ми мали фінансування. Усе скінчилося з появою хартій, і відтоді гроші пожирали юристи.
      goal: Доставити запчастини на майданчик форпосту.
    "23":
      payloadName: Наказ про евакуацію
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Обидві хартії вгризаються в одну й ту саму скельну товщу з протилежних боків. Цилиндр породи між ними тоншає з кожною зміною. Наші прилади спостерігають за цим ще відтоді, як вони обидві сіли в каньйоні.
        - sender: ФОРПОСТ ІКСІОН
          content: Ми ніколи не були певні, чи є в Геліоні взагалі живі люди. Десять років контрактів, кожен надісланий автоматично, і жодного живого слова звідти.
        - sender: ФОРПОСТ ІКСІОН
          content: Ми оформили рекомендацію про евакуацію. Ніхто не відповів. Ти літаєш і для них теж, навігаторе — тобі тут ніхто ніколи не докоряв. Ти летиш туди, куди скеровує контракт. Ми теж.<br/><br/><b>ЦІЛЬ</b> Доставити наказ на майданчик форпосту.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Документ зареєстровано. Ніхто не зобов'язаний відповідати науковому форпосту, і ми ні від кого цього не чекаємо.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Чотириста сейсмічних подій минулого тижня. Сорок — рік тому о цій порі. Цілик породи тоншає щозміни.
        - sender: ФОРПОСТ ІКСІОН
          content: Три сторони на одному каналі, і жодна не відповість іншій. Ти — єдиний виняток.
      goal: Доставити наказ на майданчик форпосту.
    "24":
      payloadName: Глибинне освітлення
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Ми пробили вихід у провалля, і стовбур пішов униз разом із ним, з майданчиком і всім начинням. Нижче старого уступу стіни стискаються в лещата, а туман стає смоляно-чорним.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Там, унизу, оптична камера та висотомір показуватимуть різне. Вір висотоміру. Саме він каже правду.<br/><br/><b>ЦІЛЬ</b> Доставити освітлення на ЗАБІЙ ШАХТИ.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Установка світить на дні. Триста метрів колодязя, і єдине, що там зараз є — наше.
        strong: Суворо прямовисно крізь триста метрів стиснутих стін і посадка на плашку. Я бачив борти, які навіть до першого уступу не дотягували.
        weak: Вона внизу і світить. Нижче уступу стіни мало що прощають, і тобі вони теж нічого не подарували.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Триста метрів колодязя під тобою. Коли ти вперше пірнав сюди, було лише п'ятдесят вісім.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Туман стає чорним нижче уступу. Картинка збреше тобі раніше, ніж висотомір.
      goal: Доставити освітлення на ЗАБІЙ ШАХТИ.
