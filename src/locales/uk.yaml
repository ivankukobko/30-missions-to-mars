    "19":
      payloadName: Анкерні пілони
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Сьогодні вночі ми пробиваємо головний стовбур набагато глибше. Пласт, на якому ми сиділи, вироблено. Багата порода тепер лежить під нами.
