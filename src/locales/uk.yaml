          content: "КОНТРАКТ 4471-C/55 · РЕД 1 · АВТО<br/><br/>КЛАС АКТИВУ: ДИСТАНЦІЙНИЙ ВАНТАЖ / HD-7<br/>ПАРТІЯ: БУРОВА ГОЛОВКА<br/>ПРИЗНАЧЕННЯ: МАЙДАНЧИК ГЕЛІОН<br/>ПОПЕРЕДНІЙ ДОКУМЕНТ: ПОВІДОМЛЕННЯ ПРО ЗАЦІКАВЛЕНІСТЬ"
