        - sender: ""
          content: "4471-C/596 · ЗАХІД У ШТРЕК<br/>СТАТУС ПЕРЕВІЗНИКА: ПЕРЕХОДИТЬ У ВЛАСНІСТЬ ОБ'ЄКТА"
