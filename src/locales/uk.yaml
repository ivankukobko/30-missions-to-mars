          content: "КОНТРАКТ 4471-C/109 · РЕД 3 · АВТО<br/><br/>КЛАС АКТИВУ: ДИСТАНЦІЙНИЙ ВАНТАЖ / HD-7<br/>ПАРТІЯ: СЕГМЕНТ ТРУБОПРОВОДУ<br/>ПРИЗНАЧЕННЯ: МАЙДАНЧИК ГЕЛІОН<br/>СТАТУС ДІЛЯНКИ: РОБОТИ ПРИЗУПИНЕНО — НАКАЗ IXN-0071"
