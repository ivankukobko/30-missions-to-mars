    "7":
      payloadName: Сейсмічний масив
      messages:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Геліон прочитав той аналіз і зупинився на глибині, звідки взяли зразок. Ми читали той самий документ. Що глибше копаєш, то багатша руда. От і вся суть. Східну вежу піднято.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Вона рахує дрібні поштовхи, якими пласт відгукується на осідання. Вона порахує й усе, що Геліон колупатиме на заході. Хоча купив я її не для цього.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Тепер ти керуєш нашим апаратом. Усьому, що спускається у свердловину, нема чого обертатися — от воно й не обертається.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Апарат нагору не повернеться. Ніщо, що потрапляє сюди, назад не летить. Зараз він дорожчий за вантаж на ньому. На майданчику він — брухт. Не зроби з нього брухт зарано, бляшанко.<br/><br/><b>ЦІЛЬ</b> Доставити масив на МАЙДАНЧИК КЕССЛЕРА.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Масив на майданчику і дасть показники за годину. Бувало, апарати гепали його так, що мені доводилося витрачати цілий сезон на повторне калібрування.
        strong: Сів рівно і дасть показники за годину. Мені траплялися борти, після яких доводилося перекладати весь посадковий майданчик.
        weak: Він на місці й зчитує дані — це саме те, за що я заплатив. Я списував посадки й гірші за цю.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Раніше таке робили роверами. Місяці на те, що ти пролітаєш за хвилину, і жодної живої душі на тому кінці.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Відчуєш, як апарат опирається розвороту. Це не несправність, бляшанко.
      goal: Доставити масив на МАЙДАНЧИК КЕССЛЕРА.
    "8":
      payloadName: Судовий припис
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Вони будують на наших лініях огляду, навігаторе. Ми попросили трибунал їх зупинити, і він зупинив. Припис IXN-0071, підписаний на минулій сесії й переданий обом хартіям сьогодні вранці — кинути інструменти, де стоять.
        - sender: ФОРПОСТ ІКСІОН
          content: Ніщо, що спускається в цей каньйон, не повертається нагору. Вантаж, паливо, самі апарати — все лишається, і твій коридор звужується з кожною місією. І далі звужуватиметься.<br/><br/><b>ЦІЛЬ</b> Доставити судовий припис на майданчик форпосту.
      debrief:
        sender: ФОРПОСТ ІКСІОН
        content: Припис зареєстровано, обидві хартії його отримали. Кинути інструменти там, де стоять — скільки б це перемир'я не тривало.
      radio:
        - sender: ФОРПОСТ ІКСІОН
          content: Захід на посадку став набагато вужчим, навігаторе. Це не твоя провина.
        - sender: ФОРПОСТ ІКСІОН
          content: Обидві хартії отримали припис сьогодні вранці. Жодна досі не відповіла.
      goal: Доставити судовий припис на майданчик форпосту.
