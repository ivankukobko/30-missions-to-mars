        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Посади їх суворо прямовисно, бляшанко. Усе під ними — скеля, на яку ще ні в кого немає прав, і я не збираюся втратити її через кривий пілон.<br/><br/><b>ЦІЛЬ</b> Доставити пілони на ГИРЛО ШАХТИ.
      debrief:
        sender: КЕССЛЕР Г.Л.И.Б.
        content: Пілони закріплено. Усе під ними — скеля, на яку ні в кого немає прав, і так воно й буде, доки вони стоять.
        strong: Посадив рівно, кожен із них. Усе, що під ними — скеля, на яку ні в кого немає прав, і вона залишиться моєю.
        weak: Вони стоять і тримають. Перекіс коштуватиме мені тижня трамбування, але ділянку ми не втратили.
      radio:
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Ці пілони триматимуть майданчик, який я ще навіть не видовбав. Ось на скільки наперед мені доводиться замовляти тут залізо.
        - sender: КЕССЛЕР Г.Л.И.Б.
          content: Мої хлопці щомісяця опускаються глибше, бляшанко. Деякі зміни вони взагалі не бачать верхівки шахти.
