          content: "КОНТРАКТ 4471-C/596 · РЕД 11 · АВТО<br/><br/>КЛАС АКТИВУ: ДИСТАНЦІЙНИЙ ВАНТАЖ / HD-7<br/>ПАРТІЯ: АРБІТРАЖНИЙ АКТ<br/>ПРИЗНАЧЕННЯ: ШТРЕК ШАХТИ<br/>ЗНОС: У МЕЖАХ ДОПУСКУ<br/>ФОРПОСТ ІКСІОН: БІЛЬШЕ НЕ Є СТОРОНОЮ. ДОКУМЕНТИ ЗБЕРЕЖЕНО.<br/>ДОПУСК: 0.4 / 11.0 Т"
        - sender: УМОВИ ПЕРЕВЕЗЕННЯ
          content: "КРИТИЧНІ ДОПУСКИ. ЧИСТОЇ ТРАЄКТОРІЇ БІЛЬШЕ НЕМАЄ.<br/>ЖОДНИХ ПОДАЛЬШИХ ПАРТІЙ ЗА ЦИМ КОНТРАКТОМ НЕ ПЕРЕДБАЧЕНО.<br/>ПОВЕРНЕННЯ ОЧІКУЄТЬСЯ: НІ<br/>СТАТУС ПЕРЕВІЗНИКА: ПЕРЕХОДИТЬ У ВЛАСНІСТЬ ОБ'ЄКТА<br/><br/><b>ЦІЛЬ</b> Доставити акт на ШТРЕК ШАХТИ."
        - sender: ДОДАТОК A — АРБІТРАЖ
