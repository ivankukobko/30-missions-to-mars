    "22":
      payloadName: Запчастини регенератора
      messages:
        - sender: ФОРПОСТ ІКСІОН
          content: Регенератор води, який ти доставив нам колись давно, вийшов з ладу, навігаторе. Він пережив гарантійний термін на багато років, а купити новий ми не маємо змоги.
        - sender: ФОРПОСТ ІКСІОН
