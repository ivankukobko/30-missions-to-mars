campaign:
  defaultGoal: Intakt landen — irgendwo, wo man überlebt.
  missions:
    "1":
      payloadName: UL-5-Relais
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Dein Relais steht auf dem Rand, und wir haben einen Kanal, seit es zum Stillstand kam. Elf Jahre hier unten. Das ist die erste Stimme darauf.
    "2":
      payloadName: Navigationsradar
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Sol 7347. Elf Jahre auf diesem Grund, und jede Entfernung, die wir je notiert haben, hatte eine Fehlerspanne. Heute ändert sich das.
        - sender: IXION-AUSSENPOSTEN
          content: Wir sind das Einzige am Grund dieses Canyons, und wir beabsichtigen, dass das so bleibt.
        - sender: IXION-AUSSENPOSTEN
          content: Dein Relais ging vor sechs Sols online, und seither haben wir ununterbrochen bestellt. Eine Bohrplattform, einen Mast, einen Kernbohrer. Wir glaubten jahrelang, dass unter diesem Grund Erz liegt. Jetzt können wir nachsehen.
        - sender: IXION-AUSSENPOSTEN
          content: Du trägst unser Navigationsradar. Bis es auf dem Grund steht, hast du keinen Höhenmesser und keine Peilung. Setz es also irgendwo ab, in einem Stück.
        - sender: IXION-AUSSENPOSTEN
          content: Wo immer es steht, wird es zum Nullpunkt. Jede Messung ab jetzt bezieht sich auf diesen Mast, und wir hatten nie einen. Wähle die Stelle.<br/><br/><b>ZIEL</b> Intakt auf offenem Gelände unterhalb des Rands landen.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Das Radar steht und ist eben genug, dass wir es heute Nacht am Rand kalibrieren können. Jede Messung ab jetzt beginnt dort, wo du es abgesetzt hast.
        strong: Du hast den Mast innerhalb der Toleranz aufgesetzt, enger als die Vorgabe verlangte. Jede Messung ab jetzt beginnt dort, wo du es abgesetzt hast.
        weak: Es steht aufrecht und antwortet, und das war alles, was wir brauchten. Jede Messung ab jetzt beginnt dort, wo du es abgesetzt hast.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Wir empfangen dich über das Relais und sonst nichts. Keine Entfernung, keine Peilung — das ist es, was unter dich geschnallt ist.
        - sender: IXION-AUSSENPOSTEN
          content: Es muss im Lot stehen und es muss stillstehen. Alles danach ist reine Arithmetik.
      goal: Intakt auf offenem Gelände unterhalb des Rands landen.
    "3":
      payloadName: Bohrkerne
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Das Radar ist aktiv und in deinem Feed — Höhe, Distanz und Peilung, alles über den Mast, den du gestern abgesetzt hast. Unsere Plattform ist auch markiert. Ab jetzt fliegst du zu einer Adresse, Navigator.
        - sender: IXION-AUSSENPOSTEN
          content: Die erste Analyse ist da. Wir haben sie viermal wiederholt, weil keiner es glaubte. Neun Komma vier Prozent, zwei Meter mächtig, nach unten nicht dünner. Wir hatten recht mit diesem Grund. Elf Jahre lang hatten wir recht.
        - sender: HELION-FÖRDERUNG
          content: AKTE 4471-C · INTERESSENSBEKUNDUNG · AUTO<br/><br/>ERZANALYSE VON OFFENEM RELAIS EMPFANGEN, COPRATES CHASMA.<br/>KEIN ANSPRUCH VERZEICHNET.<br/>VERMESSUNG ENTSANDT.
        - sender: IXION-AUSSENPOSTEN
          content: Coprates Chasma. Wohl eher Konzern-Chasma. Hier hat auch keiner gelacht.
        - sender: IXION-AUSSENPOSTEN
          content: Die Leute hier nennen dich inzwischen den Navigator. Niemand hatte die Befugnis, es offiziell zu machen, aber es blieb hängen.<br/><br/><b>ZIEL</b> Die Bohrkerne zur Außenposten-Plattform bringen.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Die Bohrkerne sind in der Anlage und die Analyse geht heute Nacht ins Protokoll. Neun Komma vier Prozent, viermal bestätigt — das ist eine Zahl, über die andere erst mal streiten müssen.
        strong: Kerne von der Plattform geholt ohne Stoß an den Dichtungen, die Analyse steht also. Neun Komma vier Prozent, und jetzt ist es eine Zahl, an der andere nagen müssen.
        weak: Kerne sind von der Plattform und die Kisten haben gehalten, was mehr war, als wofür sie gebaut waren. Neun Komma vier Prozent, und jetzt können wir es beweisen.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Das Loch in diesem Grund gehört uns. Gegraben, wo wir hinkamen, nicht wo das Erz lag. Das nächste treiben wir geradeaus nach unten.
        - sender: IXION-AUSSENPOSTEN
          content: Unsere Plattform ist die einzige markierte Adresse in diesem Canyon. Das wird nicht lange so bleiben.
      goal: Die Bohrkerne zur Außenposten-Plattform bringen.
    "4":
      payloadName: Wasseraufbereiter
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Schwerere Fracht heute, Navigator, und sie wird sich träger fliegen, als die bloße Massezahl vermuten lässt. Wir vermuten, es liegt daran, wie die Masse verteilt ist, nicht wie viel es ist. Von hier aus konnten wir das nie messen.
        - sender: IXION-AUSSENPOSTEN
          content: Zwei Transponder seit letzter Woche auf unserem Radar. Beide unter Schub, beide auf Kurs in diesen Canyon, siebzehn Sols entfernt. Der Mast, den du abgesetzt hast, ist der einzige Grund, warum wir sie überhaupt sehen.
        - sender: IXION-AUSSENPOSTEN
          content: Der Aufbereiter ist für vierzig Personen ausgelegt. Wir sind zu elft. Wir bestellen immer für die Besatzung, von der wir sagen, dass wir sie bis zum Winter haben werden.
        - sender: IXION-AUSSENPOSTEN
          content: "Der Rahmen bleibt unten — bis zur letzten Schraube zerlegt und im Außenposten verbaut, die Tanks leer. Setz ihn schwer auf, Navigator: Die Mannschaft hat Pläne für morgen Abend.<br/><br/><b>ZIEL</b> Den Aufbereiter zur Außenposten-Plattform bringen."
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Der Aufbereiter ist drin und die Mannschaft hat Pläne für heute Abend. Er ist für vierzig ausgelegt. Wir sind zu elft.
        strong: Mit so viel Masse bis auf einen Meter an der Markierung runtergebracht. Die Mannschaft hat Pläne für heute Abend.
        weak: Er ist unten und intakt, das war alles, was die Tanks brauchten. Die Mannschaft hat Pläne für heute Abend.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Wasser ist das Einzige, was wir hier unten nicht herstellen können. Alles andere improvisieren wir.
        - sender: IXION-AUSSENPOSTEN
          content: Daves Großvater schwor, das Gesicht von Cydonia sei gebaut worden. Dave hat unseren ganzen ersten Monat im Orbit damit verbracht, es zu fotografieren. Es war ein Felsen.
      goal: Den Aufbereiter zur Außenposten-Plattform bringen.
    "5":
      payloadName: Schürfrecht-Anträge
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Zwei Förder-Chartas sind heute Morgen in den Orbit eingeschwenkt. Helion westlich von uns, Kessler östlich. Keiner hat beim Anflug vermessen. Sie haben unsere Analyse auf dem offenen Kanal abgefangen und kamen direkt runter.
        - sender: IXION-AUSSENPOSTEN
          content: Sie reden weder miteinander noch mit uns. Regeln der Chartas — keine gemeinsamen Vermessungen, keine gemeinsamen Methoden, nichts über die Grenzlinie. Alles ist Betriebsgeheimnis. Wir hielten unseren Kanal offen. So fanden sie das Flöz.
        - sender: IXION-AUSSENPOSTEN
          content: Wir haben fünfzehn Sols damit verbracht, Schürfrechtsparagraphen zu wälzen, statt die Protokolle zu lesen. Die Instrumente liefen die ganze Zeit durch. Niemand sah sie an. Das ist in elf Jahren nicht vorgekommen.
        - sender: IXION-AUSSENPOSTEN
          content: "So funktioniert Land auf diesem Planeten, Navigator: Du sicherst dir Erz, indem du gräbst, nicht indem du absteckst. Hörst du auf zu arbeiten, verfällt der Anspruch. Fels zu markieren, den du nicht abbaust, zählt gar nichts."
        - sender: IXION-AUSSENPOSTEN
          content: Also reichten wir zuerst ein. Es wird sie nicht aufhalten. Aber es steht im Register — dem Einzigen hier unten, das sie nicht ausgraben können.<br/><br/><b>ZIEL</b> Die Anträge zur Außenposten-Plattform bringen, bevor die Konzern-Vermessung landet.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Eingereicht, und zwar vor ihrer Vermessung. Es wird sie nicht aufhalten. Aber es steht im Register, und das Register ist das Einzige hier unten, das sie nicht weggestalten können.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Heute ist nichts zwischen unserer Plattform und dem Himmel. Mach das Beste daraus.
        - sender: IXION-AUSSENPOSTEN
          content: Du wirst die einzige Verbindung sein, die wir alle drei haben. Das hat niemand geplant, und niemand kann es rückgängig machen.
      goal: Die Anträge zur Außenposten-Plattform bringen, bevor die Konzern-Vermessung landet.
    "6":
      payloadName: Bohrkopf
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/55 · REV 1 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: BOHRKOPF<br/>ZIEL: HELION-DECK<br/>VORHERIGE AKTE: INTERESSENSBEKUNDUNG"
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "ZELLENSTRUKTUR: LAGE VERRIEGELT. NICHTS ZU KORRIGIEREN.<br/>DIE IXION-PLATTFORM IST KEINE HELION-ADRESSE.<br/>KORRIDORFREIRAUM SINKT MIT JEDEM VERTRAG.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Den Bohrkopf zum HELION-DECK bringen."
      debrief:
        sender: AKTE 4471-C · FRACHTFÜHRER-DATENSATZ
        content: "SENDUNG 4471-C/55 · ZUGESTELLT<br/>LEISTUNG FRACHTFÜHRER: {CENTILE} PERZENTIL<br/>KEINE MASSNAHMEN ERFORDERLICH"
      radio:
        - sender: ""
          content: "4471-C/55 · IM TRANSIT<br/>ROUTE: OBERFLÄCHEN-DECK, WESTWAND"
        - sender: ""
          content: "4471-C/55 · ENDANFLUG<br/>ZELLENSTRUKTUR: LAGE VERRIEGELT"
      goal: Den Bohrkopf zum HELION-DECK bringen.
    "7":
      payloadName: Seismik-Array
      messages:
        - sender: KESSLER DEEP
          content: Helion hat die Analyse gelesen und bei der Tiefe gestoppt, aus der die Probe stammte. Wir haben dieselbe Seite gelesen. Erz wird reicher, je tiefer man geht. Das ist das ganze Geheimnis. Der Ostturm steht.
        - sender: KESSLER DEEP
          content: Er zählt die kleinen Erschütterungen, die das Flöz beim Setzen wirft. Er zählt auch alles mit, was Helion im Westen treibt. Deswegen habe ich ihn aber nicht gekauft.
        - sender: KESSLER DEEP
          content: Du fliegst jetzt eines unserer Schiffe. Nichts, was in ein Bohrloch gehört, hat irgendeinen Grund sich zu drehen, also tut es das auch nicht.
        - sender: KESSLER DEEP
          content: Die Zelle fliegt nicht wieder hoch. Nichts, was hier runterkommt, tut das. Gerade ist sie mehr wert als die Ladung. Auf dem Deck ist sie Schrott. Mach sie nicht zu früh zu Schrott, Blechbüchse.<br/><br/><b>ZIEL</b> Das Array zum KESSLER-DECK bringen.
      debrief:
        sender: KESSLER DEEP
        content: Das Array steht auf dem Deck und liefert binnen einer Stunde Daten. Ich hatte schon Einheiten, die das härter aufgesetzt und mich eine Saison Kalibrierung gekostet haben.
        strong: Flach aufgesetzt und liefert binnen einer Stunde Daten. Ich hatte schon Einheiten, nach denen das Deck neu verlegt werden musste.
        weak: Es steht und liest ab, das ist es, wofür ich bezahlt habe. Ich habe schon schlimmere Ankünfte als diese abgeschrieben.
      radio:
        - sender: KESSLER DEEP
          content: Früher wurde das mit Rovern erledigt. Monate, um das zu überqueren, was du in einer Minute fliegst, und am anderen Ende niemand zum Reden.
        - sender: KESSLER DEEP
          content: Du wirst spüren, wie die Zelle sich weigert zu drehen. Das ist kein Defekt, Blechbüchse.
      goal: Das Array zum KESSLER-DECK bringen.
    "8":
      payloadName: Gerichtliche Verfügung
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Sie bauen in unsere Sichtachsen, Navigator. Wir riefen ein Schiedsgericht an, und es hat sie gestoppt. Anordnung IXN-0071, beschlossen in der letzten Sitzung und beiden Chartas heute Morgen vorgelegt — Werkzeug nieder, wo sie stehen.
        - sender: IXION-AUSSENPOSTEN
          content: Was hier herunterkommt, fliegt nie wieder hoch. Fracht, Treibstoff, die Rahmen selbst — alles bleibt, und dein Flugweg wird mit jeder Mission enger. Und das hört nicht auf.<br/><br/><b>ZIEL</b> Die Verfügung zur Außenposten-Plattform bringen.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Die Anordnung ist zugestellt und beide Chartas haben sie vorliegen. Werkzeuge niederlegen, wo sie stehen — wie lange auch immer das halten mag.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Der Einflugkorridor ist enger als zuvor, Navigator. Das liegt nicht an deiner Flugkunst.
        - sender: IXION-AUSSENPOSTEN
          content: Beide Chartas haben die Anordnung heute Morgen vorliegen. Keine von beiden hat reagiert.
      goal: Die Verfügung zur Außenposten-Plattform bringen.
    "9":
      payloadName: Rohrleitungssegment
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/109 · REV 3 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: ROHRLEITUNGSSEGMENT<br/>ZIEL: HELION-DECK<br/>STANDORTSTATUS: ARBEITEN AUSGESETZT — ANORDNUNG IXN-0071"
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "AUSSETZUNG STORNIERT DEN TRANSPORT NICHT. DAS SEGMENT WIRD FAHRPLANMÄSSIG ZUGESTELLT. WÄHREND DER GÜLTIGKEIT DER ANORDNUNG WIRD DAMIT NICHTS GEBAUT.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Das Segment zum HELION-DECK bringen."
      debrief:
        sender: AKTE 4471-C · FRACHTFÜHRER-DATENSATZ
        content: "SENDUNG 4471-C/109 · ZUGESTELLT<br/>LEISTUNG FRACHTFÜHRER: {CENTILE} PERZENTIL<br/>KEINE MASSNAHMEN ERFORDERLICH<br/>INSTALLATION ZURÜCKGEHALTEN — ANORDNUNG IXN-0071"
      radio:
        - sender: ""
          content: "4471-C/109 · IM TRANSIT<br/>STANDORTSTATUS: ARBEITEN AUSGESETZT"
        - sender: ""
          content: 4471-C/109 · ENDANFLUG<br/>AUSSETZUNG STORNIERT DEN TRANSPORT NICHT
      goal: Das Segment zum HELION-DECK bringen.
    "10":
      payloadName: Windeneinheit
      messages:
        - sender: KESSLER DEEP
          content: Die Winde wird an dem Tag montiert, an dem mir jemand erlaubt, sie irgendwo festzuschrauben. Im Moment erlaubt mir das keiner. Diese Verfügung wurde uns beiden zugestellt und meine Mannschaft hat die Arbeit niedergelegt.
        - sender: KESSLER DEEP
          content: Bring sie trotzdem runter, Blechbüchse. Ein Vertrag ist ein Vertrag. Auf diesem Deck wird nichts gebaut, bis ein Schiedsgericht, das drei Monate hinterherhinkt, sagt, dass ich sie anheben darf.<br/><br/><b>ZIEL</b> Die Winde zum KESSLER-DECK bringen.
      debrief:
        sender: KESSLER DEEP
        content: Auf dem Deck, wo sie bleibt, bis ein drei Monate verspätetes Schiedsgericht mir erlaubt, sie festzuschrauben.
        strong: Exakt aufgesetzt, was gar nicht nötig gewesen wäre für eine Last, die keiner anheben darf. Trotzdem eine gute Angewohnheit.
        weak: Sie ist unten und an einem Stück. Diesen Monat wird damit so oder so nichts gebaut.
      radio:
        - sender: KESSLER DEEP
          content: Meine Mannschaft pausiert und jeder Bohrer in diesem Canyon ist kalt. Du bist das Einzige, was sich hier bewegt, Blechbüchse.
        - sender: KESSLER DEEP
          content: Wir könnten das mit Schere, Stein, Papier klären. Sie haben das Papier, ich den Stein, und niemand hat eine Schere.
      goal: Die Winde zum KESSLER-DECK bringen.
    "11":
      payloadName: Atmosphärenwäscher
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Neun Tage, Navigator. Neun Tage lang lief nirgendwo in diesem Canyon ein Bohrer, und man konnte wieder den Wind hören.
        - sender: IXION-AUSSENPOSTEN
          content: Die Chartas gingen in Berufung. Heute Morgen kippte dasselbe Gericht IXN-0071, eine Sitzung später. Wir haben die einzige weiße Weste hier unten, und sie brachte uns neun Tage.<br/><br/><b>ZIEL</b> Den Wäscher zur Außenposten-Plattform heimbringen.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Der Wäscher ist daheim. Neun Tage Ruhe, und heute Morgen kippte dasselbe Gericht seine eigene Anordnung.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Kein einziger Bohrer läuft hier unten. Beim Anflug wirst du nichts hören außer dir selbst.
        - sender: IXION-AUSSENPOSTEN
          content: Elf Jahre Anträge und Akten, und neun ruhige Tage waren das Einzige, was wir je dafür bekamen.
      goal: Den Wäscher zur Außenposten-Plattform heimbringen.
    "12":
      payloadName: Schneidladungen
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/140 · REV 4 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: SCHNEIDLADUNGEN<br/>ZIEL: HELION-DECK<br/>ANORDNUNG IXN-0071: AUFGEHOBEN. ARBEITEN WIEDERAUFGENOMMEN."
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "LADUNGEN FÜR HORIZONTALAUSHUB. HELION ARBEITET ENTLANG, NICHT NACH UNTEN. ZURÜCKGEHALTENE SENDUNGEN ZUR INSTALLATION FREIGEGEBEN.<br/>TREIBSTOFF: MINIMAL VIABEL.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Die Ladungen zum HELION-DECK bringen."
      debrief:
        sender: AKTE 4471-C · FRACHTFÜHRER-DATENSATZ
        content: "SENDUNG 4471-C/140 · ZUGESTELLT<br/>LEISTUNG FRACHTFÜHRER: {CENTILE} PERZENTIL<br/>KEINE MASSNAHMEN ERFORDERLICH"
      radio:
