      goal: Die Verstrebung zum HELION-DECK bringen.
    "18":
      payloadName: Erzprozessor
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/290 · REV 7 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: ERZPROZESSOR<br/>ZIEL: SCHACHTSTOLLEN, WESTENDE<br/>HELION-DECK: STILLGELEGT. KEINE WEITEREN OBERFLÄCHENLIEFERUNGEN.<br/>TOLERANZ: 2.9 / 11.0 T"
        - sender: IXION-AUSSENPOSTEN
          content: Helion ist von der Oberfläche verschwunden, Navigator — rein in den Stollen. Kessler ist darunter und treibt den Schacht voran. Alles, was hier oben stand, als du ankamst, hat sich eingegraben, oder wir sind es.
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "SCHACHT HINABFLIEGEN, WESTLICH IN DEN STOLLEN EINBIEGEN, IM INNEREN NIVELLIEREN.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Nach Westen in den Stollen einbiegen. Zustellung am SCHACHTSTOLLEN."
      debrief:
        sender: AKTE 4471-C · FRACHTFÜHRER-DATENSATZ
        content: "SENDUNG 4471-C/290 · ZUGESTELLT<br/>LEISTUNG FRACHTFÜHRER: {CENTILE} PERZENTIL<br/>KEINE MASSNAHMEN ERFORDERLICH<br/>OBERFLÄCHENBETRIEB EINGESTELLT"
      radio:
        - sender: ""
          content: "4471-C/290 · IM TRANSIT<br/>HELION-DECK: STILLGELEGT"
        - sender: ""
          content: 4471-C/290 · STOLLENANFLUG<br/>SEITLICHER EINFLUG, WESTENDE
      goal: Nach Westen in den Stollen einbiegen. Zustellung am SCHACHTSTOLLEN.
    "19":
      payloadName: Verankerungspylone
      messages:
        - sender: KESSLER DEEP
          content: Wir treiben den Hauptschacht heute Nacht viel tiefer. Das Flöz, an dem wir dran sind, ist erschöpft. Das gute Gestein liegt jetzt unter uns.
        - sender: KESSLER DEEP
          content: Helion hält diesen Abschnitt. Sie haben ihn zuerst angeschnitten. Ich halte, was darunterliegt, denn sonst geht da niemand runter.
        - sender: KESSLER DEEP
          content: Setz sie sauber und gerade auf, Blechbüchse. Alles darunter ist Fels, den noch niemand beansprucht hat, und ich verliere ihn nicht wegen eines schiefen Pylons.<br/><br/><b>ZIEL</b> Die Pylone zum SCHACHTKOPF bringen.
      debrief:
        sender: KESSLER DEEP
        content: Pylone sind verankert. Alles darunter ist Fels, den niemand beansprucht hat, und so bleibt es, solange sie halten.
        strong: Gerade aufgesetzt, alle miteinander. Alles darunter ist Fels, den niemand beansprucht hat, und ich behalte ihn.
        weak: Sie sitzen und halten. Schief kostet mich eine Woche Stopfen, aber nicht das Gelände.
      radio:
        - sender: KESSLER DEEP
          content: Diese Pylone halten ein Deck, das ich noch gar nicht gegraben habe. So weit im Voraus muss ich hier unten bestellen.
        - sender: KESSLER DEEP
          content: Meine Mannschaft arbeitet jeden Monat tiefer, Blechbüchse. Manche Schichten sehen sie den Schachtrand gar nicht.
      goal: Die Pylone zum SCHACHTKOPF bringen.
    "20":
      payloadName: Abstiegskabel
      messages:
        - sender: KESSLER DEEP
          content: Wir haben den Schacht über Nacht vertieft und das Deck auf die neue Sohle verlegt. Weiter unter dem Canyon als alles, was du bisher angeflogen hast.
        - sender: KESSLER DEEP
          content: Das Bohrloch ist jetzt kaum breiter als dein Fahrwerk und es gibt keinen Raum, eine schlechte Linie zu korrigieren, wenn du erst mal drin bist. Mach es oberhalb der Kante richtig, nicht darunter.<br/><br/><b>ZIEL</b> Das Kabel zur SCHACHTSIMSE bringen.
      debrief:
        sender: KESSLER DEEP
        content: Kabel liegt auf der Simse. Das Bohrloch ist ab hier kaum breiter als dein Fahrwerk, und es wird nicht wieder breiter.
        strong: Saubere Linie den ganzen Weg hinab durch ein Bohrloch ohne Spielraum für Korrekturen. Jeder Flug ab jetzt hat diesen Schacht oder einen engeren.
        weak: Es ist unten. In diesem Loch ist kein Platz, um eine schlechte Linie auszubügeln, und das hast du beim Reinfliegen gemerkt.
      radio:
        - sender: KESSLER DEEP
          content: Das Deck unter dir ist drei Tage alt. Das davor liegt unter unserem eigenen Abraum.
        - sender: KESSLER DEEP
          content: Nichts zum Festhalten auf dem Weg nach unten. Weiter wird das Bohrloch danach nicht mehr.
      goal: Das Kabel zur SCHACHTSIMSE bringen.
    "21":
      payloadName: Gegenanspruchs-Bake
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/372 · REV 8 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: GEGENANSPRUCHS-BAKE<br/>ZIEL: SCHACHTSTOLLEN<br/>TOLERANZ: 2.1 / 11.0 T"
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "KESSLER DEEP BETREIBT ANLAGEN UNTERHALB DER SOHLE. DAS FLÖZ WIRD NUN VON BEIDEN SEITEN BEARBEITET UND IST UMSTRITTEN.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Den Canyon queren. Die Bake zum SCHACHTSTOLLEN bringen."
        - sender: ANHANG A — SCHIEDSVERFAHREN
          content: DER FRACHTFÜHRER IST KEINE PARTEI DIESES VERFAHRENS UND HAT KEIN RECHT AUF ANHÖRUNG.
      debrief:
        sender: AKTE 4471-C · FRACHTFÜHRER-DATENSATZ
        content: "SENDUNG 4471-C/372 · ZUGESTELLT<br/>LEISTUNG FRACHTFÜHRER: {CENTILE} PERZENTIL<br/>KEINE MASSNAHMEN ERFORDERLICH"
      radio:
        - sender: ""
          content: "4471-C/372 · IM TRANSIT<br/>FLÖZSTATUS: UMSTRITTEN"
        - sender: ""
          content: 4471-C/372 · STOLLENANFLUG<br/>ANLAGEN UNTERHALB DER SOHLE
      goal: Den Canyon queren. Die Bake zum SCHACHTSTOLLEN bringen.
    "22":
      payloadName: Aufbereiter-Ersatzteile
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Der Wasseraufbereiter, den du uns damals gebracht hast, ist ausgefallen, Navigator. Er hat seine Spezifikation um Jahre überlebt, und einen neuen können wir uns nicht leisten.
        - sender: IXION-AUSSENPOSTEN
          content: Die meisten dieser Jahre waren wir gefördert — ein Stipendium für elf Leute und eine Anlage, die meist lief. Es endete, als die Chartas landeten. Seitdem ging alles an Anwälte und an Land, das wir ohnehin verlieren würden.
        - sender: IXION-AUSSENPOSTEN
          content: "Deshalb: Ersatzteile. Die leichteste Last, die wir dich je holen ließen. Das ist keine Güte von uns — es entspricht exakt dem Restguthaben auf dem Konto.<br/><br/><b>ZIEL</b> Die Teile zur Außenposten-Plattform bringen."
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Teile sind da. Die leichteste Last, die wir je beauftragt haben, und so groß wie das, was noch auf dem Konto ist.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Der Aufbereiter aus den frühen Tagen hat versagt. Er hat seine Lebensdauer um Jahre übertroffen.
        - sender: IXION-AUSSENPOSTEN
          content: Wir hatten mal Fördergelder. Das endete mit der Landung der Chartas, seither fraßen Anwälte alles auf.
      goal: Die Teile zur Außenposten-Plattform bringen.
    "23":
      payloadName: Evakuierungsbefehl
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Beide Chartas schneiden jetzt von gegenüberliegenden Seiten in dieselbe Felswand. Der Pfeiler dazwischen wird mit jeder Schicht dünner. Unsere Instrumente beobachten das, seit bevor die beiden gelandet sind.
        - sender: IXION-AUSSENPOSTEN
          content: Wir waren nie sicher, ob Helion überhaupt eine menschliche Besatzung hat. Zehn Jahre Verträge, jeder einzelne automatisch eingereicht, und kein einziges Wort von einem Menschen dort drüben.
        - sender: IXION-AUSSENPOSTEN
          content: Wir haben eine Evakuierung empfohlen. Niemand hat geantwortet. Du fliegst auch für sie, Navigator — keiner nimmt dir das übel. Du gehst, wohin der Vertrag dich schickt. Wir auch.<br/><br/><b>ZIEL</b> Den Befehl zur Außenposten-Plattform bringen.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Es ist hinterlegt. Niemand ist verpflichtet, einem Außenposten zu antworten, und wir erwarten es auch von niemandem.
      radio:
        - sender: IXION-AUSSENPOSTEN
          content: Vierhundert Erschütterungen letzte Woche. Vierzig vor einem Jahr um diese Zeit. Der Pfeiler wird jede Schicht dünner.
        - sender: IXION-AUSSENPOSTEN
          content: Drei Parteien auf einem Kanal und keine einzige antwortet der anderen. Du bist die Ausnahme.
      goal: Den Befehl zur Außenposten-Plattform bringen.
    "24":
      payloadName: Tiefenschacht-Leuchten
      messages:
        - sender: KESSLER DEEP
          content: Wir sind in den Abgrund durchgebrochen und der Schacht ist mit ihm nach unten abgesackt, samt Deck. Unterhalb der alten Simse rücken die Wände eng zusammen und der Nebel wird pechschwarz.
        - sender: KESSLER DEEP
          content: Da unten werden das optische Signal und der Höhenmesser nicht übereinstimmen. Vertrau dem Höhenmesser. Das ist der, der recht hat.<br/><br/><b>ZIEL</b> Die Beleuchtung zur SCHACHTSOHLE bringen.
      debrief:
        sender: KESSLER DEEP
        content: Die Anlage leuchtet da unten. Dreihundert Meter Schacht und das Einzige da unten gehört jetzt uns.
        strong: Schnurgerade durch dreihundert Meter zusammenrückende Felswände und flach aufgesetzt. Ich habe schon Einheiten geflogen, die nicht mal die Simse schafften.
        weak: Sie ist unten und brennt. Unter der Simse verzeihen die Wände nicht viel, und sie haben dir davon auch nicht viel geschenkt.
      radio:
        - sender: KESSLER DEEP
          content: Dreihundert Meter Schacht unter dir. Beim ersten Mal, als du reinflogst, waren es achtundfünfzig.
        - sender: KESSLER DEEP
          content: Der Nebel wird pechschwarz unter der Simse. Dein Feed wird dich eher anlügen als der Höhenmesser.
      goal: Die Beleuchtung zur SCHACHTSOHLE bringen.
    "25":
      payloadName: Flözladungen
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/500 · REV 9 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: FLÖZLADUNGEN<br/>ZIEL: SCHACHTSTOLLEN<br/>VERSCHLEISS: INNERHALB DER TOLERANZ<br/>TOLERANZ: 0.7 / 11.0 T"
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "VOLLSTÄNDIGE CANYONQUERUNG, DANN SEITLICHER EINFLUG IN DEN STOLLEN. JEDER TEILABSCHNITT WURDE BEREITS GEFLOGEN. NICHT IN EINEM EINZIGEN VERTRAG.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Die Ladungen zum SCHACHTSTOLLEN bringen."
        - sender: ANHANG A — SCHIEDSVERFAHREN
          content: VERFAHREN DAUERT AN. DER FRACHTFÜHRER IST KEINE PARTEI.
      debrief:
        sender: AKTE 4471-C · FRACHTFÜHRER-DATENSATZ
        content: "SENDUNG 4471-C/500 · ZUGESTELLT<br/>LEISTUNG FRACHTFÜHRER: {CENTILE} PERZENTIL<br/>KEINE MASSNAHMEN ERFORDERLICH"
      radio:
        - sender: ""
          content: "4471-C/500 · IM TRANSIT<br/>ZEITPLANABWEICHUNG: NULL"
        - sender: ""
          content: "4471-C/500 · STOLLENANFLUG<br/>VERSCHLEISS: INNERHALB DER TOLERANZ"
      goal: Die Ladungen zum SCHACHTSTOLLEN bringen.
    "26":
      payloadName: Schutzmantel
      messages:
        - sender: KESSLER DEEP
          content: Das schwerste Einzelstück, das je hier runterflog. Westwand bis Schachtgrund, durch alles, was beide Chartas bauten — und pass auf die Wände auf. Alles, was je in diesen Canyon kam und nie hinausflog, steckt jetzt darin.
        - sender: KESSLER DEEP
          content: Der Kanal des Außenpostens ist seit einer halben Ewigkeit still. Früher gab es jede Schicht Funkverkehr. Nicht etwas, wofür ich Zeit hätte.
        - sender: KESSLER DEEP
          content: Wenn das Ding erst mal gedeckelt ist, kann ich eine Ladung unter das Flöz setzen, ohne die Decke zu verlieren. Helion schneidet seit einem Jahr darauf zu und kommt immer noch nicht an das ran, was unter uns liegt.
        - sender: KESSLER DEEP
          content: Mach das hier ordentlich. Ich würde es niemand anderem anvertrauen.<br/><br/><b>ZIEL</b> Den Schutzmantel zur SCHACHTSOHLE bringen.
      debrief:
        sender: KESSLER DEEP
        content: Gedeckelt und sitzt. Ich hatte schon Lasten, die schlechter auf demselben Deck lagen, und musste eine Kolonne runterschicken, um sie geradezubiegen.
        strong: Im ersten Anflug aufgesetzt. Ich hatte schon Einheiten, die drei Anläufe für dieses Deck brauchten, und selbst das habe ich noch als gute Arbeit durchgewinkt.
        weak: Er ist unten und hält, mehr verlangt das Deck nicht. Ich habe schon Einheiten abgeschrieben, die weniger geschafft haben.
      radio:
        - sender: KESSLER DEEP
          content: Die Mannschaft ist von der Sohle weg, während du reinkommst. Niemand arbeitet unter so einer Last.
        - sender: KESSLER DEEP
          content: Der Wind bricht ab, wenn du den Rand überquerst. Alles darunter ist das Atmen des Lochs.
      goal: Den Schutzmantel zur SCHACHTSOHLE bringen.
    "27":
      payloadName: Bohrkern-Archiv
      messages:
        - sender: IXION-AUSSENPOSTEN
          content: Sol 7905. Wir fahren den Außenposten herunter, Navigator. Elf von uns in den frühen Tagen; weniger jetzt. Alles, was wir über diesen Canyon gelernt haben, ist auf diesem Archiv — jede Sondierung, jeder Bohrkern, die Mast-Kalibrierung.
        - sender: IXION-AUSSENPOSTEN
          content: Flieg es ein letztes Mal nach Hause, Navigator.
        - sender: IXION-AUSSENPOSTEN
          content: Das Radar bleibt an. Wir lassen es unter Strom — die Chartas können es nutzen oder nicht. Du behältst deine Peilung, auch wenn wir fort sind. Das schien uns das Mindeste.<br/><br/><b>ZIEL</b> Das Archiv zur Außenposten-Plattform zurückbringen.
      debrief:
        sender: IXION-AUSSENPOSTEN
        content: Das Archiv ist daheim. Das Radar bleibt unter Strom — du behältst deine Peilung, auch wenn wir fort sind. Das schien uns das Mindeste zu sein.
      radio:
        - sender: IXION-AUSSENPOSTEN
