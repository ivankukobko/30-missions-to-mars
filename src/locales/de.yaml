      goal: Die Bohranlage zum HELION-DECK bringen.
    "17":
      payloadName: Gewölbeverstrebung
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/265 · REV 6 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: GEWÖLBEVERSTREBUNG<br/>ZIEL: HELION-DECK"
