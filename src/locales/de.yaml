    "29":
      payloadName: Letzte Ladung
      messages:
        - sender: KESSLER DEEP
          content: Fast ein ganzes Jahr in diesem Schlund und er ist immer noch nicht mit uns fertig. Den Schacht hinab, den der Außenposten angefangen hat, und jeden Meter unterhalb des ersten Stücks hast du selbst dort reingeflogen.
        - sender: KESSLER DEEP
          content: Siebenhundert Kilo, genau wie die Schneidladungen — das bist du schon mal geflogen. Niemand sonst ist mehr im Canyon.
        - sender: KESSLER DEEP
          content: Der Außenposten hat sich nicht zurückgezogen, Navigator. Hier zieht niemand ab. Ich hörte ihren Kanal verstummen — einer nach dem anderen, bis keiner mehr die Sendetaste drückte. Also sind es nur noch du, ich und dreihundert Meter—
        - sender: IXION-AUSSENPOSTEN
          content: Wir sind das Einzige am Grund dieses Canyons, und wir beabsichtigen, dass das so bleibt.
        - sender: KESSLER DEEP
          content: —Loch. Bring es runter.<br/><br/><b>ZIEL</b> Die Ladung zur SCHACHTSOHLE bringen.
      radio:
        - sender: KESSLER DEEP
          content: Jeder Meter unter dem ersten Abschnitt ist etwas, das du selbst dort reingesetzt hast.
        - sender: KESSLER DEEP
          content: Jeder Bohrer ist aus. Seit Wochen gab es kein Geräusch in diesem Canyon, das nicht von dir oder mir stammte.
      goal: Die Ladung zur SCHACHTSOHLE bringen.
  epilogue:
