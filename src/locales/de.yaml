        - sender: ""
          content: "4471-C/140 · ENDANFLUG<br/>TREIBSTOFF: MINIMAL VIABEL"
      goal: Die Ladungen zum HELION-DECK bringen.
    "13":
      payloadName: Schachtverkleidung
      messages:
        - sender: KESSLER DEEP
          content: Das Array hört das Flöz seit einer Saison ab. Jede Nacht dasselbe — reicheres Gestein weiter unten, jedes Mal mehr kleine Beben. Helion las dasselbe und hörte auf, falls dort überhaupt jemand liest. Seid ihr zwei verwandt, Blechbüchse?
        - sender: KESSLER DEEP
          content: Wie auch immer. Diese Verkleidung ist das Letzte, was du mir an die Oberfläche bringst. Ab morgen treiben wir Ixions alten Stollen nach unten. Einen richtigen Schacht, schnurgerade in das Loch, das sie angefangen haben.
        - sender: KESSLER DEEP
          content: Die schwerste Last, die du je für uns getragen hast, und das Deck ist nicht breiter geworden. Bring sie flach rein.<br/><br/><b>ZIEL</b> Die Verkleidung zum KESSLER-DECK bringen.
      debrief:
        sender: KESSLER DEEP
        content: Das Letzte, was du mir je an die Oberfläche bringst. Ab morgen treiben wir Ixions alten Stollen nach unten.
        strong: Flach, erster Anflug, auf einem Deck, das seit dem letzten Mal nicht gewachsen ist. Das Letzte, was du mir hier oben bringst.
        weak: Sie liegt auf dem Deck und die Verkleidung hat keine Risse, das war der einzige Teil, der zählte. Das Letzte, was du mir hier oben bringst.
      radio:
        - sender: KESSLER DEEP
          content: Die letzte Ladung, die je auf einem Oberflächen-Deck für uns landet. Danach geht alles ins Loch.
        - sender: KESSLER DEEP
          content: Den gesamten leeren Weltraum durchquert, um hier anzukommen, und die Arbeit besteht darin, Dreck zu schaufeln. Wieder mal. Diesen Teil erwähnt nie jemand.
      goal: Die Verkleidung zum KESSLER-DECK bringen.
    "14":
      payloadName: Baggerkern
      messages:
        - sender: KESSLER DEEP
          content: Der Schacht ist offen. Flieg noch nicht rein. Am Grund gibt es noch nichts zum Landen und die Wände sind noch nicht verkleidet.
        - sender: IXION-AUSSENPOSTEN
          content: Das ist unser alter Stollen, den er da nach unten treibt, Navigator. Vierhundert Meter von unserer Plattform entfernt, und er hat das Land nie beantragt.<br/><br/>Flieg den Vertrag. Wir verlangen nicht von dir, Partei zu ergreifen.
        - sender: KESSLER DEEP
          content: Der Kern kommt aufs Deck, wie immer. Schau dir das Loch im Vorbeiflug an, wenn du willst. Das ist das Seichteste, was es je sein wird.<br/><br/><b>ZIEL</b> Den Kern zum KESSLER-DECK bringen.
      debrief:
        sender: KESSLER DEEP
        content: Der Kern liegt auf dem Deck. Morgen wandert er ins Loch und kommt nie wieder hoch, genau wie alles andere hier.
        strong: Im ersten Anflug sauber aufgesetzt. Das Loch ist heute noch flach genug, dass ein schlechter Anflug mich eine Woche gekostet hätte.
        weak: Unten und stabil. Bei dieser Tiefe verzeiht das Loch noch Fehler. Das wird sich ändern.
      radio:
        - sender: KESSLER DEEP
          content: Dieses Loch gehörte Ixion, bevor es irgendwem gehörte. Niemand konnte uns verbieten, es zu nutzen, also taten wir es.
        - sender: KESSLER DEEP
          content: Schau es dir im Vorbeiflug an. Das ist das Seichteste, was es je sein wird.
      goal: Den Kern zum KESSLER-DECK bringen.
    "15":
      payloadName: Schachtbeleuchtung
      messages:
        - sender: KESSLER DEEP
          content: Die Plattform auf der Schachtsohle steht, tief unter dem Canyon, und die Wände stehen auf beiden Seiten eng.
        - sender: KESSLER DEEP
          content: Nichts Schweres heute, Blechbüchse. Meine zweite Lichterkette für diesen Schacht. Die erste liegt unter unserem Abraum, und meine Leute arbeiten seitdem mit Helmlampen.<br/><br/><b>ZIEL</b> Hinab in den Schacht. Zustellung am SCHACHTKOPF.
      debrief:
        sender: KESSLER DEEP
        content: Die Lichter sind drin. Meine Leute arbeiten mit Helmlampen, seit die erste Kette unter dem Abraum verschwand.
        strong: Den Schacht runter und im ersten Versuch auf die Plattform. Meine Mannschaft lief eine ganze Saison mit Helmlampen herum.
        weak: Sie ist unten und die Kette ist ganz geblieben, mehr braucht ein Licht nicht zu tun. Die Stirnlampen gehen heute Abend aus.
      radio:
        - sender: KESSLER DEEP
          content: Du bist jetzt im Loch, nicht mehr darüber. Achte auf die Wände, nicht auf den Boden.
        - sender: KESSLER DEEP
          content: Ich will, dass du dieses Loch lernst, solange es noch Fehler verzeiht, Blechbüchse.
      goal: Hinab in den Schacht. Zustellung am SCHACHTKOPF.
    "16":
      payloadName: Horizontal-Bohranlage
      messages:
        - sender: HELION-FÖRDERUNG
          content: "VERTRAG 4471-C/240 · REV 5 · AUTO<br/><br/>GUTSKLASSE: FERNFRACHT / HD-7<br/>SENDUNG: HORIZONTAL-BOHRANLAGE<br/>ZIEL: HELION-DECK<br/>METHODE: HORIZONTAL. KESSLER TREIBT DAS LOCH NACH UNTEN. HELION TREIBT ES ENTLANG."
        - sender: BEFÖRDERUNGSBEDINGUNGEN
          content: "TITELGRUNDLAGE: VORHERIGE ARBEITEN. HELION ÜBERNIMMT DAS WESTENDE VON IXIONS STOLLEN. KEIN NEUES LOCH.<br/>SCHWERSTE SENDUNG BISHER. TRÄGHEIT IST KEIN DEFEKT.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Die Bohranlage zum HELION-DECK bringen."
      debrief:
