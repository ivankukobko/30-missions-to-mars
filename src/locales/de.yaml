          content: "DIE VERSTREBUNG TRÄGT DIE STOLLENDECKE. AB DEM NÄCHSTEN VERTRAG ERFOLGT DIE LIEFERUNG DIREKT IN DEN STOLLEN — DEN SCHACHT HINAB, DANN WESTWÄRTS ENTLANG DER WAND.<br/>RÜCKKEHR ERWARTET: NEIN<br/><br/><b>ZIEL</b> Die Verstrebung zum HELION-DECK bringen."
      debrief:
