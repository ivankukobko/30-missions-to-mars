      - atAltitude: 300
        atSeconds: 19
  - id: 3
    sol: 14
    client: outpost
    payload:
      mass: 0.4
      shape: sphere
    fuel: 380
    start: { x: -4, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - from: outpost
      - from: outpost
      - from: helion
      # The campaign's one joke, and the only card in the game that is a reply. It is a
      # groaner, it is a prediction, and it is made the first time a corporation speaks on
      # the outpost's own channel — the setup is Helion filing the real name one card
      # earlier, which is the only time anybody says it.
      #
      # No `navigator` here. The name is coined on the next card and cannot be used before
      # it. `either` is doing the other half: the joke was told to a telemetry link, and
      # nothing came back.
      - from: outpost
      - from: outpost
    adds:
      digs:
        # Eleven years of digging where they could reach rather than where the ore was.
        #
        # One column wide at the lip and crooked below it. Everything the charters cut later
        # is square, and that difference is the only thing in this canyon that says who was
        # here first — the shape of the rock, from the prologue on, with nothing to land in.
        # By mission 14 it is a doorway two other companies use.
        #
        # Mission 3's first radio call names the hole as Ixion's and says why it wanders,
        # which is as far as a brief goes. What it deliberately does not say is what the
        # difference in shape means: the authorship stays in the geometry, unstated, so a
        # player who notices the charters cut square has found it rather than been told.
        #
        # **"The hole in this floor", and the wording is load-bearing.** `mount: floor` with
        # `anchorToWall: east` is a shaft sunk *down through the canyon floor*, positioned
        # near the east wall — not a cut into the wall's face. A draft read "the cut in the
        # east wall", which is a different excavation from the one this file carves, and
        # would have been contradicted by every later stage: Kessler drives this same mouth
        # downward from mission 14, which only works because it already goes down.
        #
        # "This floor" over "the canyon floor" because it is Ixion's own idiom — eleven
        # years on this floor, ore under this floor — and there is exactly one excavation in
        # the campaign, so the definite article cannot point at the wrong hole.
        #
        # A hole in the floor is also the easier thing to have seen. The descent looks down
        # the canyon's length at the floor the whole way in, where a notch in a side wall
        # would have needed the player to be looking across it. The dig resolves to x=48 on
        # seed 1697381726 against a flight path running x=-4 to the pad at -12. Not framed
        # here, because `place()` moves the vehicle without re-framing the camera, so the
        # line still states rather than points: a call that says *look* is false on any
        # attempt where it is off-screen, and this channel's rule is that a call holds on
        # every one. Same hedge as Kessler's "look at the hole on your way past if you want"
        # at mission 14.
        #
        # The 130-character cap on this channel settled the final wording. A radio call is
        # taken in rather than read, so the three-sentence draft lost its middle clause to
        # "dug where we could reach, not where the ore was" — the better line as well as the
        # legal one.
        #
        # **`shaft`, from its first stage.** This was `ixion-working`, which read as a second
        # excavation and is not one: there is exactly one hole in this canyon and this is its
        # opening cut. `mergeDigs` never knew the difference — it collapses records by
        # overlapping x, not by id, and `Missions.test.ts` asserts the five stages come out as
        # one excavation — so the two names only ever disagreed with each other in the source.
        # The rename says what the geometry already did. Whose working it is still changes at
        # mission 14; that is a fact about the campaign, not about the hole.
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 24
          cells: |
            xxxxx0xxxxxx
            xxxx00xxxxxx
      props:
        - kind: pad
          corp: outpost
          id: outpost-main
          x: -14
          width: 16

    radio:
      - atAltitude: 620
        atSeconds: 12
      - atAltitude: 300
        atSeconds: 19
