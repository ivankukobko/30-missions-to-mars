# 30 Missions to Mars - Campaign Specification

missions:
  # ---------------------------------------------------------------------------- 1
  #
  # The flight that makes every other flight possible, and the only silent one.
  #
  # `messages` is empty and that is the design, not an omission: nobody can transmit to
  # you before the link exists. No brief, no sender, no card, no music. The first voice in
  # the campaign is Ixion's on mission 2, and it arrives as a *consequence of this
  # landing*.
  #
  # One control. `AIRFRAMES.relay` locks rotation and carries no lateral thruster, so the
  # only input is when to burn and the only thing it decides is how hard you arrive. The
  # entry is straight down over the shelf `RIM_SITES` grades on the rim — an earlier
  # version drifted sideways so that one control decided two things, and it is unlandable:
  # `resolveContact` tests total speed, and a vehicle that cannot rotate can never null a
  # sideways velocity. See `PROLOGUE`'s note in Missions.ts.
  #
  # `target: null` because there is no address, because there is nobody to have given you
  # one. Any survivable touchdown completes it.
  - id: 1
    sol: 0
    client: outpost
    payload:
      name: UL-5 Relay
      mass: 0
    fuel: 300
    start: { x: 150, y: 1020 }
    target: null
    failDepth: -60
    airframe: relay
    messages: []

  - id: 2
    sol: 6
    client: outpost
    payload:
      name: Navigation Radar
      mass: 0.5
      shape: sphere
    fuel: 405
    start: { x: 0, y: 1290 }
    target: null
    failDepth: -60
    colonyBudget:
      outpost: 3
    messages:
      - sender: IXION OUTPOST
        content: >-
          Sol 7347. Your relay reached the rim yesterday, and we have had a channel ever since. This is the first voice on it.
      - sender: IXION OUTPOST
        content: >-
          We are the only thing at the bottom of this canyon, and we intend to stay that way.
      - sender: IXION OUTPOST
        content: >-
          You are carrying our navigation radar. Until it stands on the floor you have no altimeter and no bearings, so put it down anywhere, in one piece.
      - sender: IXION OUTPOST
        content: >-
          Where you set it is where every measurement we take begins. Choose the spot.<br/><br/><b>OBJECTIVE</b> Land intact on open ground below the rim.

  - id: 3
    sol: 14
    client: outpost
    payload:
      name: Core Samples
      mass: 0.4
    fuel: 380
    start: { x: -4, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Radar is up and on your feed now — altitude, range and bearing, all off the mast you set down yesterday. Our pad is marked too. You are flying to an address from here on, navigator.
      - sender: IXION OUTPOST
        content: >-
          First core assay is back. Nine point four percent, two metres thick, and it does not thin going down. Eleven years on this floor and we never had the rig to prove it.
      - sender: HELION EXTRACTION
        content: >-
          FILE 4471-C · NOTICE OF INTEREST · AUTO<br/><br/>ORE ASSAY READ FROM AN OPEN RELAY, COPRATES CHASMA.<br/>NO CLAIM ON RECORD.<br/>SURVEY DISPATCHED.
      - sender: IXION OUTPOST
        content: >-
          You set the mast down tighter than the spec asked. People here started calling you the navigator. Nobody had the standing to make it official, and it stuck.<br/><br/><b>OBJECTIVE</b> Deliver the core samples to the outpost pad.
    adds:
      digs:
        # Eleven years of digging where they could reach rather than where the ore was.
        #
        # One column wide at the lip and crooked below it. Everything the charters cut later
        # is square, and that difference is the only thing in this canyon that says who was
        # here first — the shape of the rock, from the prologue on, with no brief mentioning
        # it and nothing to land in. By mission 14 it is a doorway two other companies use.
        - id: ixion-working
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 24
          cells: |
            xxxxx0xxxxxx
            xxxx00xxxxxx
      props:
        - kind: pad
          corp: outpost
          id: outpost-main
          col: 18
          row: 0
          x: -14
          width: 16

  - id: 4
    sol: 31
    client: outpost
    payload:
      name: Water Reclaimer
      mass: 0.8
    fuel: 370
    start: { x: 4, y: 1230 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Heavier load today, navigator, and it handles worse than the mass number says it should. We have never worked out why.
      - sender: IXION OUTPOST
        content: >-
          The reclaimer is rated for forty people. There are eleven of us. We keep ordering for the crew we keep saying we will have by winter.
      - sender: IXION OUTPOST
        content: >-
          The frame stays down here — stripped to the last screw and built into the outpost, tanks siphoned and all. Land it heavy, navigator: the crew has plans for tomorrow night.<br/><br/><b>OBJECTIVE</b> Deliver the reclaimer to the outpost pad.

  - id: 5
    sol: 48
    client: outpost
    payload:
      name: Claim Filings
      mass: 0.2
    fuel: 350
    start: { x: -5, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Two extraction charters made orbit this morning. Helion to our west, Kessler to our east. Neither surveyed on the way in. They read our assay off the open channel and came straight down.
      - sender: IXION OUTPOST
        content: >-
          They will not talk to each other, or to us. Charter rules — no shared survey, no shared method, nothing over the line. We kept our channel open. That is how they found the seam.
      - sender: IXION OUTPOST
        content: >-
          Here is how ground works on this planet, navigator. You hold ore by digging it, not by marking it. Stop working a claim and it lapses. Mark rock you are not working and it counts for nothing.
      - sender: IXION OUTPOST
        content: >-
          So we filed first. It will not stop them. But it is on the record, and the record is the one thing down here they cannot dig up.<br/><br/><b>OBJECTIVE</b> Get the filings to the outpost pad before the corporate survey lands.

  - id: 6
    sol: 55
    client: helion
    payload:
      name: Drill Head
      mass: 1.2
    fuel: 380
    start: { x: -7, y: 1250 }
    target: helion-crest
    failDepth: -60
    # A charter's first mission normally gets FIRST_MISSION_CELLS — three cells, so the
    # canyon the player first sees reads as unclaimed. That is right for mission 1 and
    # wrong the moment a corp's *first* mission also raises a deck: the crest sits six
    # rows up and three cells cannot reach it, so the platform this brief calls "live"
    # hung in mid-air with a 56-unit gap beneath it. Thirty is what mission 7 grants
    # anyway, and at that budget the stack closes to within a deck's own thickness.
    colonyBudget:
      helion: 30
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/55 · REV 1 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: DRILL HEAD<br/>DESTINATION: HELION DECK<br/>PRIOR FILE: NOTICE OF INTEREST
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          FRAME: ATTITUDE LOCKED. NOTHING TO RECOVER.<br/>THE IXION PAD IS NOT A HELION ADDRESS.<br/>CORRIDOR CLEARANCE FALLS WITH EVERY CONTRACT.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the drill head to HELION DECK.
    adds:
      props:
        - kind: pad
          corp: helion
          id: helion-crest
          col: 14
          row: 12
          x: -34
          y: 73
          width: 14

  - id: 7
    sol: 62
    client: kessler
    payload:
      name: Seismic Array
      mass: 0.9
    fuel: 385
    start: { x: 7, y: 1250 }
    target: kessler-crest
    failDepth: -60
    # Kessler's own first mission raises its own deck — the same case as mission 5, and it
    # was floating on every seed measured. See the note there.
    colonyBudget:
      kessler: 30
    messages:
      - sender: KESSLER DEEP
        content: >-
          Helion read that assay and stopped at the depth the sample came from. We read the same page. The ore gets richer the deeper you go — that is our whole position. East tower is up.
      - sender: KESSLER DEEP
        content: >-
          The array you are carrying listens to the rock. It counts the small quakes the seam throws as it settles. We will want those numbers.
      - sender: KESSLER DEEP
        content: >-
          You fly one of ours now. Nothing that goes down a bore has any business turning, so it does not.
      - sender: KESSLER DEEP
        content: >-
          The frame does not go back up — nothing that comes down here does. It is the costliest thing you are carrying until it is on the deck; after that, scrap. Do not make it scrap early, tin can.<br/><br/><b>OBJECTIVE</b> Deliver the array to KESSLER DECK.
    adds:
      props:
        - kind: pad
          corp: kessler
          id: kessler-crest
          col: 27
          row: 12
          x: 40
          y: 73
          width: 14

  - id: 8
    sol: 106
    client: outpost
    payload:
      name: Legal Injunction
      mass: 0.2
    fuel: 340
    start: { x: 0, y: 1190 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          They are building on our sightlines, navigator. We asked a tribunal to stop them. The order came back signed on the last window, served this morning — both charters down tools where they stand.
      - sender: IXION OUTPOST
        content: >-
          You will have noticed the run in is tighter. That is not your flying.
      - sender: IXION OUTPOST
        content: >-
          Nothing that comes down this canyon goes back up. Cargo, fuel, the frames themselves — it all stays, and the gap you fly closes a little more each mission. It will keep closing.<br/><br/><b>OBJECTIVE</b> Bring the injunction to the outpost pad.

  - id: 9
    sol: 109
    client: helion
    # Served this mission and the next. The cargo still arrives — Helion does not stop
    # shipping because a tribunal said so — and nothing is built with it. See `colonyFrozen`.
    colonyFrozen: [helion, kessler]
    payload:
      name: Pipeline Segment
      mass: 1.6
    fuel: 405
    start: { x: -13, y: 1230 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/109 · REV 3 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: PIPELINE SEGMENT<br/>DESTINATION: HELION DECK<br/>SITE STATUS: WORK SUSPENDED — ORDER IXN-0071
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          SUSPENSION DOES NOT CANCEL CARRIAGE. THE SEGMENT IS DELIVERED ON SCHEDULE. NOTHING IS BUILT WITH IT WHILE THE ORDER STANDS.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the segment to HELION DECK.

  - id: 10
    sol: 112
    client: kessler
    colonyFrozen: [helion, kessler]
    payload:
      name: Winch Assembly
      mass: 1.3
    fuel: 390
    start: { x: 13, y: 1210 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          The winch goes up the day someone lets me bolt it to something. Right now nobody does. That order is served on both of us and my crew is stood down.
      - sender: KESSLER DEEP
        content: >-
          Bring it down anyway, tin can. It is still a contract. Nothing gets built on that deck until a tribunal three months out of date says I can pick it up.<br/><br/><b>OBJECTIVE</b> Deliver the winch to KESSLER DECK.

  - id: 11
    sol: 115
    client: outpost
    payload:
      name: Atmosphere Scrubber
      mass: 1.4
    fuel: 385
    start: { x: -8, y: 1170 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Nine days, navigator. Nine days with no drill running anywhere in this canyon, and you could hear the wind again.
      - sender: IXION OUTPOST
        content: >-
          Then the charters appealed, and this morning the same tribunal overturned its own order — one window later. We have the only clean record down here, and it bought us nine days.<br/><br/><b>OBJECTIVE</b> Bring the scrubber home to the outpost pad.

  - id: 12
    sol: 140
    client: helion
    payload:
      name: Cutting Charges
      mass: 0.7
    fuel: 360
    start: { x: 11, y: 1170 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/140 · REV 4 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: CUTTING CHARGES<br/>DESTINATION: HELION DECK<br/>ORDER IXN-0071: VACATED. WORK RESUMED.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          CHARGES FOR LATERAL EXCAVATION. HELION WORKS ALONG, NOT DOWN. SUSPENDED CONSIGNMENTS NOW CLEARED FOR INSTALLATION.<br/>FUEL: MINIMUM VIABLE.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the charges to HELION DECK.

  - id: 13
    sol: 165
    client: kessler
    payload:
      name: Shaft Liner
      mass: 1.7
    fuel: 405
    start: { x: 0, y: 1170 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          The array has been reading the seam for a season. Same story every night — richer rock further down, more small quakes each time. Helion read the same and stopped, if there is anyone at Helion to do the reading. You two related, tin can?
      - sender: KESSLER DEEP
        content: >-
          Anyway. This liner is the last thing you bring me on the surface. From tomorrow we take Ixion's old working down — a proper shaft, straight down the hole they started.
      - sender: KESSLER DEEP
        content: >-
          Heaviest load you have carried for us, and the deck has not grown. Bring it in flat.<br/><br/><b>OBJECTIVE</b> Deliver the liner to KESSLER DECK.

  - id: 14
    sol: 190
    client: kessler
    payload:
      name: Excavator Core
      mass: 1.5
    fuel: 405
    start: { x: 5, y: 1150 }
    target: kessler-crest
    failDepth: -95
    messages:
      - sender: KESSLER DEEP
        content: >-
          The shaft is open. Do not take it down yet — there is nothing at the bottom to land on and the walls are not lined.
      - sender: IXION OUTPOST
        content: >-
          That is our old working he is driving down, navigator. Four hundred metres from our slab, and he never filed for the ground.<br/><br/>Fly the contract. We are not asking you to choose.
      - sender: KESSLER DEEP
        content: >-
          Core goes on the deck, same as always. Look at the hole on your way past if you want. That is the shallowest it will ever be.<br/><br/><b>OBJECTIVE</b> Deliver the core to KESSLER DECK.
    adds:
      digs:
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 58
          # One complex, one mouth. It was Ixion's and it is nobody's now — both charters
          # widened a hole somebody else cut, and neither could stop the other using it, so
          # what began as an outpost's working ends up municipal on a planet that has no
          # municipality. Which is the same joke as ARBITRATION: MOOT, dug instead of filed.
          #
          # That is also what makes "Ixion dug first and was outrun" a thing the player
          # flies through rather than a line in a brief.
          #
          # Rows 1 and 2 are the shared gallery; its west end is Helion's working, a room
          # you fly into level, which is the HD-7's whole reason to exist. Row 2 matches
          # row 1's own width rather than tapering, so that room is two cells tall — one
          # cell reads as a slot barely wider than the hull, and a room the player is
          # meant to level off and manoeuvre inside has to be flyable, not just nominal.
          # Below row 2 it necks down to one column, and that is Kessler going down under
          # the mouth's own east half.
          #
          # Cumulative — each stage draws the whole complex as it stands, so one mission can
          # be read without replaying the campaign.
          cells: |
            xxxxxxxx00xxxxx
            x000000000xxxxx
            x000000000xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx

  - id: 15
    sol: 215
    client: kessler
    payload:
      name: Shaft Lighting
      mass: 0.6
    fuel: 390
    start: { x: 0, y: 1130 }
    target: shaft-head
    failDepth: -95
    messages:
      - sender: KESSLER DEEP
        content: >-
          Pad is in at the shaft floor. Fifty-eight metres under the canyon, walls close on both sides.
      - sender: KESSLER DEEP
        content: >-
          Light load on purpose today, tin can. I want you learning the hole while it is still forgiving.<br/><br/><b>OBJECTIVE</b> Take it down the shaft. Deliver to SHAFT HEAD.
    adds:
      props:
        - kind: pad
          corp: kessler
          id: shaft-head
          col: 30
          row: -9
          x: 60
          y: -58
          width: 12
          attachToDig: shaft
          atCell: { col: 9, row: 4 }

  - id: 16
    sol: 240
    client: helion
    payload:
      name: Lateral Bore Rig
      mass: 1.8
    fuel: 420
    start: { x: -14, y: 1150 }
    target: helion-crest
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/240 · REV 5 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: LATERAL BORE RIG<br/>DESTINATION: HELION DECK<br/>METHOD: HORIZONTAL. KESSLER WORKS THE HOLE DOWN. HELION WORKS IT ALONG.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          TITLE BASIS: PRIOR WORKING. HELION TAKES THE WEST END OF IXION'S GALLERY. NO NEW HOLE.<br/>HEAVIEST CONSIGNMENT TO DATE. INERTIA IS NOT A FAULT.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the rig to HELION DECK.
    adds:
      digs:
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 58
          # Helion opens no working of their own — they take the west end of the gallery
          # Ixion cut. The complex gains no ground by this contract; what changes is whose
          # it is, which is the whole of Helion's position.
          cells: |
            xxxxxxxx00xxxxx
            x000000000xxxxx
            x000000000xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx

  - id: 17
    sol: 265
    client: helion
    payload:
      name: Roof Bracing
      mass: 1.2
    fuel: 405
    start: { x: -2, y: 1130 }
    target: helion-crest
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/265 · REV 6 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: ROOF BRACING<br/>DESTINATION: HELION DECK
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          THE BRACING CARRIES THE GALLERY ROOF. FROM THE NEXT CONTRACT, DELIVERY IS INTO THE GALLERY ITSELF — DOWN THE SHAFT, THEN WEST ALONG THE WALL.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the bracing to HELION DECK.

  - id: 18
    sol: 290
    client: helion
    payload:
      name: Ore Processor
      mass: 1.6
    fuel: 430
    start: { x: 4, y: 1130 }
    target: shaft-gallery
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/290 · REV 7 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: ORE PROCESSOR<br/>DESTINATION: SHAFT GALLERY, WEST END<br/>HELION DECK: DECOMMISSIONED. NO FURTHER SURFACE DELIVERY.<br/>ALLOWANCE: 2.9 / 11.0 T
      - sender: IXION OUTPOST
        content: >-
          Helion is off the surface now, navigator — into the gallery. Kessler is below it, driving the shaft. Everything that stood up here when you arrived is dug in, or it is us.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          DESCEND THE SHAFT, TURN WEST ALONG THE GALLERY, LEVEL OFF INSIDE.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Turn west along the gallery. Deliver to SHAFT GALLERY.
    adds:
      props:
        - kind: pad
          corp: helion
          id: shaft-gallery
          col: 12
          row: -2
          x: -48
          y: -12
          width: 12
          attachToDig: shaft
          atCell: { col: 4, row: 2 }
    decommissions:
      - helion-crest

  - id: 19
    sol: 315
    client: kessler
    payload:
      name: Anchor Pylons
      mass: 1.5
    fuel: 420
    start: { x: 0, y: 1130 }
    target: shaft-head
    failDepth: -190
    messages:
      - sender: KESSLER DEEP
        content: >-
          We take the main shaft down tonight — another hundred and thirty metres. The seam we are on is worked out. The good rock is below us now.
      - sender: KESSLER DEEP
        content: >-
          The pylons anchor the new lining, tin can. If they are not seated square, everything we hang under them comes back up the fast way.<br/><br/><b>OBJECTIVE</b> Deliver the pylons to SHAFT HEAD.

  - id: 20
    sol: 340
    client: kessler
    payload:
      name: Descent Cable
      mass: 1.0
    fuel: 430
    start: { x: -4, y: 1130 }
    target: shaft-ledge
    failDepth: -190
    messages:
      - sender: KESSLER DEEP
        content: >-
          The pylons held. We sank the shaft overnight and relaid the deck on the new floor, a hundred and seventy metres under the rim.
      - sender: KESSLER DEEP
        content: >-
          The bore is barely wider than your gear now and there is no room to fix a bad line once you are in it. Get it right above the lip, not below.<br/><br/><b>OBJECTIVE</b> Deliver the cable to SHAFT LEDGE.
    adds:
      # The sinking mission 19's pylons paid for, carved *after* that delivery rather than
      # before it — which is what its own brief says ("goes down another hundred and thirty
      # metres tonight") and what the decks need. `shaft-head`'s deck is `attachToDig`,
      # so carving this a mission early dropped the working deck to -169 for mission 19 and
      # then stood the next one back up at -45: a 124-unit climb in the one direction this
      # shaft is only ever supposed to go.
      digs:
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 172
          # One complex, one mouth. It was Ixion's and it is nobody's now — both charters
          # widened a hole somebody else cut, and neither could stop the other using it, so
          # what began as an outpost's working ends up municipal on a planet that has no
          # municipality. Which is the same joke as ARBITRATION: MOOT, dug instead of filed.
          #
          # That is also what makes "Ixion dug first and was outrun" a thing the player
          # flies through rather than a line in a brief.
          #
          # Rows 1 and 2 are the shared gallery; its west end is Helion's working, a room
          # you fly into level, which is the HD-7's whole reason to exist. Row 2 matches
          # row 1's own width rather than tapering, so that room is two cells tall — one
          # cell reads as a slot barely wider than the hull, and a room the player is
          # meant to level off and manoeuvre inside has to be flyable, not just nominal.
          # Below row 2 it necks down to one column, and that is Kessler going down under
          # the mouth's own east half.
          #
          # Cumulative — each stage draws the whole complex as it stands, so one mission can
          # be read without replaying the campaign.
          cells: |
            xxxxxxxx00xxxxx
            x000000000xxxxx
            x000000000xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
            xxxxxxxxx0xxxxx
      props:
        - kind: pad
          corp: kessler
          id: shaft-ledge
          col: 30
          row: -7
          x: 60
          # Placeholder. `attachToDig` resolves both from the bore's real floor — see
          # mission 15's deck, authored the same way.
          y: -169
          width: 11
          attachToDig: shaft
          atCell: { col: 9, row: 13 }
    # One deck in the Kessler bore at a time. The shaft pad is `attachToDig`, so mission
    # 20's sinking already dragged it from -54 to the new floor at -168 — leaving it
    # standing would put two Kessler decks in the same hole with nothing but the ledge
    # ever flown to again. Nothing targets `shaft-head` after 20, so striking it here
    # costs no destination.
    decommissions:
      - shaft-head

  - id: 21
    sol: 372
    client: helion
    payload:
      name: Counterclaim Beacon
      mass: 0.8
    fuel: 420
    start: { x: 16, y: 1110 }
    target: shaft-gallery
    failDepth: -190
    messages:
      - sender: HELION EXTRACTION
        content: >-
