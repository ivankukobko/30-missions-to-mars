# 30 Missions to Mars - Campaign Specification

missions:
  # ---------------------------------------------------------------------------- 1
  #
  # The flight that makes every other flight possible, and the only silent one.
  #
  # `messages` is empty and that is the design, not an omission: nobody can transmit to
  # you before the link exists. No brief, no sender, no card, no music. The first voice in
  # the campaign is Ixion's on mission 2, and it arrives as a *consequence of this
  # landing*.
  #
  # One control. `AIRFRAMES.relay` locks rotation and carries no lateral thruster, so the
  # only input is when to burn and the only thing it decides is how hard you arrive. The
  # entry is straight down over the shelf `RIM_SITES` grades on the rim — an earlier
  # version drifted sideways so that one control decided two things, and it is unlandable:
  # `resolveContact` tests total speed, and a vehicle that cannot rotate can never null a
  # sideways velocity. See `PROLOGUE`'s note in Missions.ts.
  #
  # `target: null` because there is no address, because there is nobody to have given you
  # one. Any survivable touchdown completes it.
  - id: 1
    sol: 0
    client: outpost
    payload:
      name: UL-5 Relay
      mass: 0
    fuel: 300
    start: { x: 150, y: 1020 }
    target: null
    failDepth: -60
    airframe: relay
    messages: []

  - id: 2
    sol: 6
    client: outpost
    payload:
      name: Navigation Radar
      mass: 0.5
      shape: sphere
    fuel: 405
    start: { x: 0, y: 1290 }
    target: null
    failDepth: -60
    colonyBudget:
      outpost: 3
    messages:
      - sender: IXION OUTPOST
        content: >-
          Sol 7347. Your relay came up on the rim yesterday and we have had a channel ever since — this is the first voice on it.<br/><br/>Welcome to Coprates Chasma. We are the only thing at the bottom of this canyon, and we intend to stay that way.
      - sender: IXION OUTPOST
        content: >-
          You are carrying our navigation radar. Until it is standing on the floor of this chasm you have no altimeter, no ranging and no target bearing — so put it down somewhere, anywhere, in one piece.
      - sender: IXION OUTPOST
        content: >-
          Where you set it down is where it stays, and everything we do afterwards is measured from it.<br/><br/><b>OBJECTIVE</b> Descend past the rim. Land intact on open ground.

  - id: 3
    sol: 14
    client: outpost
    payload:
      name: Core Samples
      mass: 0.4
    fuel: 380
    start: { x: -4, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Radar is up and slaved to your feed — altitude, range and target bearing, all of it off the mast you set down yesterday. Our pad is in as well, so from here on you are flying to an address.
      - sender: IXION OUTPOST
        content: >-
          Assay is back on the first cut. Nine point four across two metres, and it does not thin with depth. Eleven years on this floor and we have never had the rig to prove it.
      - sender: HELION EXTRACTION
        content: >-
          FILE 4471-C · NOTICE OF INTEREST · AUTO<br/><br/>ASSAY TELEMETRY OBSERVED ON AN UNENCRYPTED RELAY, COPRATES CHASMA.<br/>NO CLAIM OF RECORD.<br/>SURVEY DISPATCHED.
      - sender: IXION OUTPOST
        content: >-
          You placed it better than the specification asked for. We have started calling you the navigator. It is not a rank anyone here has the standing to award, but it has stuck.<br/><br/><b>OBJECTIVE</b> Deliver core samples to the outpost pad.
    adds:
      digs:
        # Eleven years of digging where they could reach rather than where the ore was.
        #
        # One column wide at the lip and crooked below it. Everything the charters cut later
        # is square, and that difference is the only thing in this canyon that says who was
        # here first — the shape of the rock, from the prologue on, with no brief mentioning
        # it and nothing to land in. By mission 15 it is a doorway two other companies use.
        - id: ixion-working
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 24
          cells: |
            xxxxx0xxxxxx
            xxxx00xxxxxx
      props:
        - kind: pad
          corp: outpost
          id: outpost-main
          col: 18
          row: 0
          x: -14
          width: 16

  - id: 4
    sol: 31
    client: outpost
    payload:
      name: Water Reclaimer
      mass: 0.8
    fuel: 370
    start: { x: 4, y: 1230 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Heavier load today, navigator, and the lag is worse than the mass number implies. We have never worked out why.
      - sender: IXION OUTPOST
        content: >-
          It is sized for forty. There are eleven of us. We are ordering for the crew we expect to have by winter.<br/><br/><b>OBJECTIVE</b> Deliver the reclaimer to the outpost pad.

  - id: 5
    sol: 48
    client: outpost
    payload:
      name: Claim Filings
      mass: 0.2
    fuel: 350
    start: { x: -5, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Two extraction charters cleared orbit this morning. Helion to our west, Kessler to our east. Neither of them surveyed anything on the way in. Neither of them had to.
      - sender: IXION OUTPOST
        content: >-
          We filed first. It will not matter, navigator, but it will be on the record — and the record is the only thing we have that they cannot dig up.<br/><br/><b>OBJECTIVE</b> Deliver the filings before the corporate survey lands.

  - id: 6
    sol: 55
    client: helion
    payload:
      name: Drill Head
      mass: 1.2
    fuel: 380
    start: { x: -7, y: 1250 }
    target: helion-crest
    failDepth: -60
    # A charter's first mission normally gets FIRST_MISSION_CELLS — three cells, so the
    # canyon the player first sees reads as unclaimed. That is right for mission 1 and
    # wrong the moment a corp's *first* mission also raises a deck: the crest sits six
    # rows up and three cells cannot reach it, so the platform this brief calls "live"
    # hung in mid-air with a 56-unit gap beneath it. Thirty is what mission 7 grants
    # anyway, and at that budget the stack closes to within a deck's own thickness.
    colonyBudget:
      helion: 30
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/55 · REV 1 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>FRAME NOTE: ATTITUDE LOCKED. NOTHING TO RECOVER.<br/>CONSIGNMENT: DRILL HEAD<br/>DESTINATION: HELION CREST — WEST APPROACH<br/>PRIOR: NOTICE OF INTEREST
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: THE IXION SLAB IS NOT A HELION ADDRESS.<br/>DELIVERY TO IT DOES NOT DISCHARGE THIS CONTRACT.<br/>CLEARANCE ON THIS CORRIDOR REDUCES WITH EVERY CONTRACT.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the drill head to HELION CREST.
    adds:
      props:
        - kind: pad
          corp: helion
          id: helion-crest
          col: 14
          row: 12
          x: -34
          y: 73
          width: 14

  - id: 7
    sol: 62
    client: kessler
    payload:
      name: Seismic Array
      mass: 0.9
    fuel: 385
    start: { x: 7, y: 1250 }
    target: kessler-crest
    failDepth: -60
    # Kessler's own first mission raises its own deck — the same case as mission 5, and it
    # was floating on every seed measured. See the note there.
    colonyBudget:
      kessler: 30
    messages:
      - sender: KESSLER DEEP
        content: >-
          Helion read the outpost's assay and stopped at the depth it was taken. We read the same page. It gets richer further down, and that is the whole of our position. East tower is up.
      - sender: KESSLER DEEP
        content: >-
          You will be flying one of ours. Nothing that goes down a bore has any business turning, so it does not. Try not to bend it, tin can — the frame costs more than the contract does.<br/><br/><b>OBJECTIVE</b> Deliver the array to KESSLER CREST.
    adds:
      props:
        - kind: pad
          corp: kessler
          id: kessler-crest
          col: 27
          row: 12
          x: 40
          y: 73
          width: 14

  - id: 8
    sol: 84
    client: kessler
    payload:
      name: Bore Casing
      mass: 1.5
    fuel: 400
    start: { x: -11, y: 1230 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          Casing is heavy and you start on the wrong side of the canyon.
      - sender: KESSLER DEEP
        content: >-
          Cross high or cross low, tin can, but cross deliberately. Drifting through the middle is how you meet the gantry Helion put up.<br/><br/><b>OBJECTIVE</b> Carry the casing east to KESSLER CREST.

  - id: 9
    sol: 106
    client: outpost
    payload:
      name: Legal Injunction
      mass: 0.2
    fuel: 340
    start: { x: 0, y: 1190 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          They are building on our sightlines. The order came back signed on the last window and it is served as of this morning. Both workings stop where they stand.
      - sender: IXION OUTPOST
        content: >-
          You will have noticed the approach is tighter than it was. That is not your handling, navigator. That is the canyon closing, and it will keep closing.<br/><br/><b>OBJECTIVE</b> Return to the outpost pad.

  - id: 10
    sol: 109
    client: helion
    # Served this mission and the next. The cargo still arrives — Helion does not stop
    # shipping because a tribunal said so — and nothing is built with it. See `colonyFrozen`.
    colonyFrozen: [helion, kessler]
    payload:
      name: Pipeline Segment
      mass: 1.6
    fuel: 405
    start: { x: -13, y: 1230 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/109 · REV 3 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: PIPELINE SEGMENT<br/>DESTINATION: HELION CREST<br/>SITE STATUS: WORK SUSPENDED — ORDER IXN-0071
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: TRANSIT CROSSES AIRSPACE CLAIMED BY KESSLER DEEP.<br/>NO DECONFLICTION AGREEMENT IS IN FORCE. NONE IS SOUGHT.<br/>SUSPENSION DOES NOT DISCHARGE CARRIAGE.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the segment to HELION CREST.

  - id: 11
    sol: 112
    client: kessler
    colonyFrozen: [helion, kessler]
    payload:
      name: Winch Assembly
      mass: 1.3
    fuel: 390
    start: { x: 13, y: 1210 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          The winch goes up the day somebody lets me bolt it to anything. The outpost got an order served on both of us and my crew are sitting on their hands.
      - sender: KESSLER DEEP
        content: >-
          Bring it down anyway, tin can. It can lie on the deck until a tribunal three months out of date decides I am allowed to pick it up.<br/><br/><b>OBJECTIVE</b> Deliver the winch to KESSLER CREST.

  - id: 12
    sol: 115
    client: outpost
    payload:
      name: Atmosphere Scrubber
      mass: 1.4
    fuel: 385
    start: { x: -8, y: 1170 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Nine days, navigator. Nine days of no drill running anywhere in this canyon, and you could hear the wind again.
      - sender: IXION OUTPOST
        content: >-
          Overturned this morning on appeal. Same tribunal, one window later. We have the only clean record in this canyon and it bought nine days.<br/><br/><b>OBJECTIVE</b> Bring the scrubber home.

  - id: 13
    sol: 140
    client: helion
    payload:
      name: Cutting Charges
      mass: 0.7
    fuel: 360
    start: { x: 11, y: 1170 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/140 · REV 4 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: CUTTING CHARGES<br/>DESTINATION: HELION CREST<br/>ORDER IXN-0071: VACATED<br/>PRIOR CONSIGNMENTS ON ROUTE: DRILL HEAD · PIPELINE SEGMENT
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: OBSTRUCTION BY PRIOR CONSIGNMENTS IS NOT A HELION LIABILITY.<br/>FUEL ALLOWANCE: MINIMUM VIABLE<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver charges to HELION CREST.

  - id: 14
    sol: 165
    client: kessler
    payload:
      name: Shaft Liner
      mass: 1.7
    fuel: 405
    start: { x: 0, y: 1170 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          Last surface delivery. Tomorrow we open the floor.
      - sender: KESSLER DEEP
        content: >-
          Heaviest thing you have carried for us, tin can, and the deck has not grown. Bring it in flat.<br/><br/><b>OBJECTIVE</b> Deliver the liner to KESSLER CREST.

  - id: 15
    sol: 190
    client: kessler
    payload:
      name: Excavator Core
      mass: 1.5
    fuel: 405
    start: { x: 5, y: 1150 }
    target: kessler-crest
    failDepth: -95
    messages:
      - sender: KESSLER DEEP
        content: >-
          The shaft is open. Do not go down it yet — there is nothing down there to land on and the walls are unlined.
      - sender: IXION OUTPOST
        content: >-
          That bore is four hundred metres from our foundation slab and nobody filed for it.<br/><br/>Fly the contract, navigator. We are not asking you to choose.
      - sender: KESSLER DEEP
        content: >-
          The core goes on the crest deck, same as always. Look at the hole on your way past if you like. It is the last time it will be that shallow.<br/><br/><b>OBJECTIVE</b> Deliver the core to KESSLER CREST.
    adds:
      digs:
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 58
          # One complex, one mouth. It was Ixion's and it is nobody's now — both charters
          # widened a hole somebody else cut, and neither could stop the other using it, so
          # what began as an outpost's working ends up municipal on a planet that has no
          # municipality. Which is the same joke as ARBITRATION: MOOT, dug instead of filed.
          #
          # That is also what makes "Ixion dug first and was outrun" a thing the player
          # flies through rather than a line in a brief.
          #
          # Row 1 is the shared gallery; its west end is Helion's working, a room you fly
          # into level, which is the HD-7's whole reason to exist. Below row 2 it necks down
          # to one column, and that is Kessler going down under the mouth's own east half.
          #
          # Cumulative — each stage draws the whole complex as it stands, so one mission can
          # be read without replaying the campaign.
          cells: |
            xxxxx00xxxxx
            x000000xxxxx
            xxxx000xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx

  - id: 16
    sol: 215
    client: kessler
    payload:
      name: Shaft Lighting
      mass: 0.6
    fuel: 390
    start: { x: 0, y: 1130 }
    target: shaft-head
    failDepth: -95
    messages:
      - sender: KESSLER DEEP
        content: >-
          Pad is in at the shaft floor. Fifty-eight metres below the canyon, walls close on both sides.
      - sender: KESSLER DEEP
        content: >-
          Light load today, tin can, and that is deliberate — I want you learning the hole while it is still forgiving.<br/><br/><b>OBJECTIVE</b> Descend the shaft. Deliver to SHAFT HEAD.
    adds:
      props:
        - kind: pad
          corp: kessler
          id: shaft-head
          col: 30
          row: -9
          x: 60
          y: -58
          width: 12
          attachToDig: shaft
          atCell: { col: 6, row: 4 }

  - id: 17
    sol: 240
    client: helion
    payload:
      name: Lateral Bore Rig
      mass: 1.8
    fuel: 420
    start: { x: -14, y: 1150 }
    target: helion-crest
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/240 · REV 5 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: LATERAL BORE RIG<br/>DESTINATION: HELION CREST<br/>EXCAVATION AUTHORISED: WEST WALL, HORIZONTAL. HELION DOES NOT SINK SHAFTS.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: HEAVIEST CONSIGNMENT CARRIED UNDER THIS CONTRACT TO DATE.<br/>INERTIA IS NOT A FAULT CONDITION.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the rig to HELION CREST.
    adds:
      digs:
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 58
          # Helion opens no working of their own — they take the west end of the gallery
          # Ixion cut. The complex gains no ground by this contract; what changes is whose
          # it is, which is the whole of Helion's position.
          cells: |
            xxxxx00xxxxx
            x000000xxxxx
            xxxx000xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx

  - id: 18
    sol: 265
    client: helion
    payload:
      name: Roof Bracing
      mass: 1.2
    fuel: 405
    start: { x: -2, y: 1130 }
    target: helion-crest
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/265 · REV 6 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: ROOF BRACING<br/>DESTINATION: HELION CREST
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: THE BRACING SEALS THE WEST GALLERY FROM THE SHAFT ON INSTALLATION.<br/>FROM THE NEXT CONTRACT THAT WORKING IS PRESSURISED. LATERAL APPROACH ONLY.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver bracing to HELION CREST.

  - id: 19
    sol: 290
    client: helion
    payload:
      name: Ore Processor
      mass: 1.6
    fuel: 430
    start: { x: 4, y: 1130 }
    target: shaft-gallery
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/290 · REV 7 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: ORE PROCESSOR<br/>DESTINATION: SHAFT GALLERY — WEST END<br/>HELION CREST: DECOMMISSIONED. DECK LIGHTING OFF.<br/>ALLOWANCE: 2.9 / 11.0 T
      - sender: IXION OUTPOST
        content: >-
          The Helion deck went dark this morning. They are in the wall now, and Kessler is in the floor.<br/><br/>Everything that stood on the surface of this canyon when you arrived is underground or is us, navigator.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: DESCEND THE SHAFT, TURN WEST ALONG THE GALLERY AND LEVEL OFF INSIDE.<br/>THE BULKHEAD INSTALLED UNDER REV 6 IS LOAD-BEARING AND WILL NOT YIELD.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Turn west along the gallery. Deliver to SHAFT GALLERY.
    adds:
      props:
        - kind: pad
          corp: helion
          id: shaft-gallery
          col: 12
          row: -2
          x: -48
          y: -12
          width: 12
          attachToDig: shaft
          atCell: { col: 1, row: 1 }
    decommissions:
      - helion-crest

  - id: 20
    sol: 315
    client: kessler
    payload:
      name: Anchor Pylons
      mass: 1.5
    fuel: 420
    start: { x: 0, y: 1130 }
    target: shaft-head
    failDepth: -190
    messages:
      - sender: KESSLER DEEP
        content: >-
          We are sinking the main shaft. The hole you have spent five missions landing beside goes down another hundred and thirty metres tonight.
      - sender: KESSLER DEEP
        content: >-
          Pylons anchor the lining. If they are not seated, everything we put below them comes back up the hard way.<br/><br/><b>OBJECTIVE</b> Deliver pylons to SHAFT HEAD.

  - id: 21
    sol: 340
    client: kessler
    payload:
      name: Descent Cable
      mass: 1.0
    fuel: 430
    start: { x: -4, y: 1130 }
    target: shaft-ledge
    failDepth: -190
    messages:
      - sender: KESSLER DEEP
        content: >-
          The pylons held. We took the shaft down overnight and relaid the deck on the new floor, a hundred and seventy metres under the rim.
      - sender: KESSLER DEEP
        content: >-
          The shaft is barely wider than your gear and there is no room to correct once you are inside it. Get it wrong above the lip, not below.<br/><br/><b>OBJECTIVE</b> Deliver to SHAFT LEDGE.
    adds:
      # The sinking mission 20's pylons paid for, carved *after* that delivery rather than
      # before it — which is what its own brief says ("goes down another hundred and thirty
      # metres tonight") and what the decks need. `shaft-head`'s deck is `attachToDig`,
      # so carving this a mission early dropped the working deck to -169 for mission 20 and
      # then stood the next one back up at -45: a 124-unit climb in the one direction this
      # shaft is only ever supposed to go.
      digs:
        - id: shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 172
          # One complex, one mouth. It was Ixion's and it is nobody's now — both charters
          # widened a hole somebody else cut, and neither could stop the other using it, so
          # what began as an outpost's working ends up municipal on a planet that has no
          # municipality. Which is the same joke as ARBITRATION: MOOT, dug instead of filed.
          #
          # That is also what makes "Ixion dug first and was outrun" a thing the player
          # flies through rather than a line in a brief.
          #
          # Row 1 is the shared gallery; its west end is Helion's working, a room you fly
          # into level, which is the HD-7's whole reason to exist. Below row 2 it necks down
          # to one column, and that is Kessler going down under the mouth's own east half.
          #
          # Cumulative — each stage draws the whole complex as it stands, so one mission can
          # be read without replaying the campaign.
          cells: |
            xxxxx00xxxxx
            x000000xxxxx
            xxxx000xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
            xxxxxx0xxxxx
      props:
        - kind: pad
          corp: kessler
          id: shaft-ledge
          col: 30
          row: -7
          x: 60
          # Placeholder. `attachToDig` resolves both from the bore's real floor — see
          # mission 16's deck, authored the same way.
          y: -169
          width: 11
          attachToDig: shaft
          atCell: { col: 6, row: 13 }
    # One deck in the Kessler bore at a time. The shaft pad is `attachToDig`, so mission
    # 20's sinking already dragged it from -54 to the new floor at -168 — leaving it
    # standing would put two Kessler decks in the same hole with nothing but the ledge
    # ever flown to again. Nothing targets `shaft-head` after 20, so striking it here
    # costs no destination.
    decommissions:
      - shaft-head

  - id: 22
    sol: 372
    client: helion
    payload:
      name: Counterclaim Beacon
      mass: 0.8
    fuel: 420
    start: { x: 16, y: 1110 }
    target: shaft-gallery
    failDepth: -190
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C/372 · REV 8 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: COUNTERCLAIM BEACON<br/>DESTINATION: SHAFT GALLERY<br/>ALLOWANCE: 2.1 / 11.0 T
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: KESSLER DEEP HAS ESTABLISHED WORKINGS BELOW THE FLOOR LINE.<br/>THE SEAM IS CONTESTED.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Cross the canyon. Deliver to SHAFT GALLERY.
      - sender: ANNEX A — ARBITRATION
        content: >-
          THE CARRIER IS NOT A PARTY TO THESE PROCEEDINGS AND HAS NO STANDING TO BE HEARD IN THEM.

  - id: 23
    sol: 404
    client: outpost
    payload:
      name: Reclaimer Parts
      mass: 0.5
      # "reclaimer" would infer a rig; this is a box of spares for one.
      shape: crate
    fuel: 375
    start: { x: 0, y: 1110 }
    target: outpost-main
    failDepth: -190
    messages:
      - sender: IXION OUTPOST
        content: >-
          The water reclaimer you brought down on your third run has failed. Twenty runs is longer than it was ever rated for, and there is no replacement to be had at a price this outpost can still meet.
