# 30 Missions to Mars - Campaign Specification

missions:
  - id: 1
    client: outpost
    payload:
      name: Navigation Radar
      mass: 0.5
      shape: sphere
    fuel: 405
    start: { x: 0, y: 1290 }
    target: null
    failDepth: -60
    colonyBudget:
      outpost: 3
    messages:
      - sender: IXION OUTPOST
        content: >-
          Welcome to Coprates Chasma. We are the only thing at the bottom of this canyon, and we intend to stay that way.
      - sender: IXION OUTPOST
        content: >-
          You are carrying our navigation radar. Until it is standing on the floor of this chasm you have no altimeter, no ranging and no target bearing — so put it down somewhere, anywhere, in one piece.
      - sender: IXION OUTPOST
        content: >-
          Where you set it down is where it stays, and everything we do afterwards is measured from it.<br/><br/><b>OBJECTIVE</b> Descend past the rim. Land intact on open ground.

  - id: 2
    client: outpost
    payload:
      name: Core Samples
      mass: 0.4
    fuel: 380
    start: { x: -4, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Radar is up and slaved to your feed — altitude, range and target bearing, all of it off the mast you set down yesterday. Our pad is in as well, so from here on you are flying to an address.
      - sender: IXION OUTPOST
        content: >-
          You placed it better than the specification asked for. We have started calling you the navigator. It is not a rank anyone here has the standing to award, but it has stuck.<br/><br/><b>OBJECTIVE</b> Deliver core samples to the outpost pad.
    adds:
      props:
        - kind: pad
          corp: outpost
          id: outpost-main
          col: 18
          row: 0
          x: -14
          width: 16

  - id: 3
    client: outpost
    payload:
      name: Water Reclaimer
      mass: 0.8
    fuel: 370
    start: { x: 4, y: 1230 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Heavier load today, navigator, and the lag is worse than the mass number implies. We have never worked out why.<br/><br/><b>OBJECTIVE</b> Deliver the reclaimer to the outpost pad.

  - id: 4
    client: outpost
    payload:
      name: Claim Filings
      mass: 0.2
    fuel: 350
    start: { x: -5, y: 1250 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Two extraction charters cleared orbit this morning. Helion to our west, Kessler to our east.
      - sender: IXION OUTPOST
        content: >-
          We filed first. It will not matter, navigator, but it will be on the record — and the record is the only thing we have that they cannot dig up.<br/><br/><b>OBJECTIVE</b> Deliver the filings before the corporate survey lands.

  - id: 5
    client: helion
    payload:
      name: Drill Head
      mass: 1.2
    fuel: 380
    start: { x: -7, y: 1250 }
    target: helion-crest
    failDepth: -60
    # A charter's first mission normally gets FIRST_MISSION_CELLS — three cells, so the
    # canyon the player first sees reads as unclaimed. That is right for mission 1 and
    # wrong the moment a corp's *first* mission also raises a deck: the crest sits six
    # rows up and three cells cannot reach it, so the platform this brief calls "live"
    # hung in mid-air with a 56-unit gap beneath it. Thirty is what mission 7 grants
    # anyway, and at that budget the stack closes to within a deck's own thickness.
    colonyBudget:
      helion: 30
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 1 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7 SIDEWINDER<br/>FRAME NOTE: ATTITUDE LOCKED. NOTHING TO RECOVER.<br/>CONSIGNMENT: DRILL HEAD<br/>DESTINATION: HELION CREST — WEST APPROACH
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: THE IXION SLAB IS NOT A HELION ADDRESS.<br/>DELIVERY TO IT DOES NOT DISCHARGE THIS CONTRACT.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the drill head to HELION CREST.
    adds:
      props:
        - kind: pad
          corp: helion
          id: helion-crest
          col: 14
          row: 12
          x: -34
          y: 73
          width: 14

  - id: 6
    client: kessler
    payload:
      name: Seismic Array
      mass: 0.9
    fuel: 385
    start: { x: 7, y: 1250 }
    target: kessler-crest
    failDepth: -60
    # Kessler's own first mission raises its own deck — the same case as mission 5, and it
    # was floating on every seed measured. See the note there.
    colonyBudget:
      kessler: 30
    messages:
      - sender: KESSLER DEEP
        content: >-
          Helion drills sideways. We drill down. East tower is up and the deck is waiting.
      - sender: KESSLER DEEP
        content: >-
          You will be flying one of ours. Nothing that goes down a bore has any business turning, so it does not. Try not to bend it, tin can — the frame costs more than the contract does.<br/><br/><b>OBJECTIVE</b> Deliver the array to KESSLER CREST.
    adds:
      props:
        - kind: pad
          corp: kessler
          id: kessler-crest
          col: 27
          row: 12
          x: 40
          y: 73
          width: 14

  - id: 7
    client: helion
    payload:
      name: Coolant Cells
      mass: 1.1
    fuel: 365
    start: { x: 3, y: 1210 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 2 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: COOLANT CELLS<br/>DESTINATION: HELION CREST
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: BOTH CHARTERS ARE BUILDING TOWARD THE CENTRE LINE.<br/>CORRIDOR CLEARANCE REDUCES ON EVERY SUBSEQUENT CONTRACT. IT IS NOT REPLANNED BETWEEN THEM.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver coolant to HELION CREST.

  - id: 8
    client: kessler
    payload:
      name: Bore Casing
      mass: 1.5
    fuel: 400
    start: { x: -11, y: 1230 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          Casing is heavy and you start on the wrong side of the canyon.
      - sender: KESSLER DEEP
        content: >-
          Cross high or cross low, tin can, but cross deliberately. Drifting through the middle is how you meet the gantry Helion put up.<br/><br/><b>OBJECTIVE</b> Carry the casing east to KESSLER CREST.

  - id: 9
    client: outpost
    payload:
      name: Legal Injunction
      mass: 0.2
    fuel: 340
    start: { x: 0, y: 1190 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          They are building on our sightlines. This injunction will be ignored, but it will be <i>filed</i>.
      - sender: IXION OUTPOST
        content: >-
          You will have noticed the approach is tighter than it was. That is not your handling, navigator. That is the canyon closing, and it will keep closing.<br/><br/><b>OBJECTIVE</b> Return to the outpost pad.

  - id: 10
    client: helion
    payload:
      name: Pipeline Segment
      mass: 1.6
    fuel: 405
    start: { x: -13, y: 1230 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 3 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: PIPELINE SEGMENT<br/>DESTINATION: HELION CREST
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: TRANSIT CROSSES AIRSPACE CLAIMED BY KESSLER DEEP.<br/>NO DECONFLICTION AGREEMENT IS IN FORCE. NONE IS SOUGHT.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the segment to HELION CREST.

  - id: 11
    client: kessler
    payload:
      name: Winch Assembly
      mass: 1.3
    fuel: 390
    start: { x: 13, y: 1210 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          Our own span goes up today. Helion will call it provocation. It is a winch.
      - sender: KESSLER DEEP
        content: >-
          Mind it on the way in, tin can. It went up this morning and it is not on the chart you flew last time.<br/><br/><b>OBJECTIVE</b> Deliver the winch to KESSLER CREST.

  - id: 12
    client: outpost
    payload:
      name: Atmosphere Scrubber
      mass: 1.4
    fuel: 385
    start: { x: -8, y: 1170 }
    target: outpost-main
    failDepth: -60
    messages:
      - sender: IXION OUTPOST
        content: >-
          Both charters now have structures inside a hundred metres of us. The sky above this pad is the only thing still open, navigator, and it is open because we filed for it.<br/><br/><b>OBJECTIVE</b> Bring the scrubber home.

  - id: 13
    client: helion
    payload:
      name: Cutting Charges
      mass: 0.7
    fuel: 360
    start: { x: 11, y: 1170 }
    target: helion-crest
    failDepth: -60
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 4 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: CUTTING CHARGES<br/>DESTINATION: HELION CREST<br/>PRIOR CONSIGNMENTS ON ROUTE: DRILL HEAD · COOLANT CELLS · PIPELINE SEGMENT
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: OBSTRUCTION BY PRIOR CONSIGNMENTS IS NOT A HELION LIABILITY.<br/>FUEL ALLOWANCE: MINIMUM VIABLE<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver charges to HELION CREST.

  - id: 14
    client: kessler
    payload:
      name: Shaft Liner
      mass: 1.7
    fuel: 405
    start: { x: 0, y: 1170 }
    target: kessler-crest
    failDepth: -60
    messages:
      - sender: KESSLER DEEP
        content: >-
          Last surface delivery. Tomorrow we open the floor.
      - sender: KESSLER DEEP
        content: >-
          Heaviest thing you have carried for us, tin can, and the deck has not grown. Bring it in flat.<br/><br/><b>OBJECTIVE</b> Deliver the liner to KESSLER CREST.

  - id: 15
    client: kessler
    payload:
      name: Excavator Core
      mass: 1.5
    fuel: 405
    start: { x: 5, y: 1150 }
    target: kessler-crest
    failDepth: -95
    messages:
      - sender: KESSLER DEEP
        content: >-
          The shaft is open. Do not go down it yet — there is nothing down there to land on and the walls are unlined.
      - sender: IXION OUTPOST
        content: >-
          That bore is four hundred metres from our foundation slab and nobody filed for it.<br/><br/>Fly the contract, navigator. We are not asking you to choose.
      - sender: KESSLER DEEP
        content: >-
          The core goes on the crest deck, same as always. Look at the hole on your way past if you like. It is the last time it will be that shallow.<br/><br/><b>OBJECTIVE</b> Deliver the core to KESSLER CREST.
    adds:
      digs:
        - id: kessler-shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 58

  - id: 16
    client: kessler
    payload:
      name: Shaft Lighting
      mass: 0.6
    fuel: 390
    start: { x: 0, y: 1130 }
    target: kessler-shaft
    failDepth: -95
    messages:
      - sender: KESSLER DEEP
        content: >-
          Pad is in at the shaft floor. Fifty-eight metres below the canyon, walls close on both sides.
      - sender: KESSLER DEEP
        content: >-
          Light load today, tin can, and that is deliberate — I want you learning the hole while it is still forgiving.<br/><br/><b>OBJECTIVE</b> Descend the shaft. Deliver to KESSLER SHAFT.
    adds:
      props:
        - kind: pad
          corp: kessler
          id: kessler-shaft
          col: 30
          row: -9
          x: 60
          y: -58
          width: 12
          attachToDig: kessler-shaft

  - id: 17
    client: helion
    payload:
      name: Lateral Bore Rig
      mass: 1.8
    fuel: 420
    start: { x: -14, y: 1150 }
    target: helion-crest
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 5 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: LATERAL BORE RIG<br/>DESTINATION: HELION CREST<br/>EXCAVATION AUTHORISED: WEST WALL, HORIZONTAL. HELION DOES NOT SINK SHAFTS.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: HEAVIEST CONSIGNMENT CARRIED UNDER THIS CONTRACT TO DATE.<br/>INERTIA IS NOT A FAULT CONDITION.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver the rig to HELION CREST.
    adds:
      digs:
        - id: helion-cavern
          anchorToWall: west
          halfWidth: 10
          depth: 46

  - id: 18
    client: helion
    payload:
      name: Roof Bracing
      mass: 1.2
    fuel: 405
    start: { x: -2, y: 1130 }
    target: helion-crest
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 6 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: ROOF BRACING<br/>DESTINATION: HELION CREST
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: THE BRACING CLOSES THE WEST EXCAVATION OVERHEAD ON INSTALLATION.<br/>FROM THE NEXT CONTRACT THAT WORKING IS LATERAL APPROACH ONLY. NO VERTICAL DESCENT.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver bracing to HELION CREST.
    adds:
      props:
        - kind: caveRoof
          corp: helion
          x: -48
          y: -12
          halfWidth: 1
          attachToDig: helion-cavern

  - id: 19
    client: helion
    payload:
      name: Ore Processor
      mass: 1.6
    fuel: 430
    start: { x: 4, y: 1130 }
    target: helion-cavern
    failDepth: -95
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 7 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: ORE PROCESSOR<br/>DESTINATION: HELION CAVERN — WEST WALL, INTERIOR<br/>HELION CREST: DECOMMISSIONED. DECK LIGHTING OFF.
      - sender: IXION OUTPOST
        content: >-
          The Helion deck went dark this morning. They are in the wall now, and Kessler is in the floor.<br/><br/>Everything that stood on the surface of this canyon when you arrived is underground or is us, navigator.
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: APPROACH BENEATH THE BRACING AND LEVEL OFF INSIDE.<br/>THE ROOF INSTALLED UNDER REV 6 IS LOAD-BEARING AND WILL NOT YIELD.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Enter the west cavern. Deliver to HELION CAVERN.
    adds:
      props:
        - kind: pad
          corp: helion
          id: helion-cavern
          col: 12
          row: -2
          x: -48
          y: -12
          width: 12
          attachToDig: helion-cavern
    decommissions:
      - helion-crest

  - id: 20
    client: kessler
    payload:
      name: Anchor Pylons
      mass: 1.5
    fuel: 420
    start: { x: 0, y: 1130 }
    target: kessler-shaft
    failDepth: -190
    messages:
      - sender: KESSLER DEEP
        content: >-
          We are sinking the main shaft. The hole you have spent five missions landing beside goes down another hundred and thirty metres tonight.
      - sender: KESSLER DEEP
        content: >-
          Pylons anchor the lining. If they are not seated, everything we put below them comes back up the hard way.<br/><br/><b>OBJECTIVE</b> Deliver pylons to KESSLER SHAFT.

  - id: 21
    client: kessler
    payload:
      name: Descent Cable
      mass: 1.0
    fuel: 430
    start: { x: -4, y: 1130 }
    target: kessler-ledge
    failDepth: -190
    messages:
      - sender: KESSLER DEEP
        content: >-
          The pylons held. We took the shaft down overnight and relaid the deck on the new floor, a hundred and seventy metres under the rim.
      - sender: KESSLER DEEP
        content: >-
          The shaft is barely wider than your gear and there is no room to correct once you are inside it. Get it wrong above the lip, not below.<br/><br/><b>OBJECTIVE</b> Deliver to KESSLER LEDGE.
    adds:
      # The sinking mission 20's pylons paid for, carved *after* that delivery rather than
      # before it — which is what its own brief says ("goes down another hundred and thirty
      # metres tonight") and what the decks need. `kessler-shaft`'s deck is `attachToDig`,
      # so carving this a mission early dropped the working deck to -169 for mission 20 and
      # then stood the next one back up at -45: a 124-unit climb in the one direction this
      # shaft is only ever supposed to go.
      digs:
        - id: kessler-shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 172
      props:
        - kind: pad
          corp: kessler
          id: kessler-ledge
          col: 30
          row: -7
          x: 60
          # Placeholder. `attachToDig` resolves both from the bore's real floor — see
          # mission 16's deck, authored the same way.
          y: -169
          width: 11
          attachToDig: kessler-shaft
    # One deck in the Kessler bore at a time. The shaft pad is `attachToDig`, so mission
    # 20's sinking already dragged it from -54 to the new floor at -168 — leaving it
    # standing would put two Kessler decks in the same hole with nothing but the ledge
    # ever flown to again. Nothing targets `kessler-shaft` after 20, so striking it here
    # costs no destination.
    decommissions:
      - kessler-shaft

  - id: 22
    client: helion
    payload:
      name: Counterclaim Beacon
      mass: 0.8
    fuel: 420
    start: { x: 16, y: 1110 }
    target: helion-cavern
    failDepth: -190
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 8 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: COUNTERCLAIM BEACON<br/>DESTINATION: HELION CAVERN
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: KESSLER DEEP HAS ESTABLISHED WORKINGS BELOW THE FLOOR LINE.<br/>THE SEAM IS CONTESTED.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Cross the canyon. Deliver to HELION CAVERN.
      - sender: ANNEX A — ARBITRATION
        content: >-
          THE CARRIER IS NOT A PARTY TO THESE PROCEEDINGS AND HAS NO STANDING TO BE HEARD IN THEM.

  - id: 23
    client: outpost
    payload:
      name: Reclaimer Parts
      mass: 0.5
      # "reclaimer" would infer a rig; this is a box of spares for one.
      shape: crate
    fuel: 375
    start: { x: 0, y: 1110 }
    target: outpost-main
    failDepth: -190
    messages:
      - sender: IXION OUTPOST
        content: >-
          The water reclaimer you brought down on your third run has failed. Twenty runs is longer than it was ever rated for, and there is no replacement to be had at a price this outpost can still meet.
      - sender: IXION OUTPOST
        content: >-
          So: parts. The lightest load we have ever sent you for, navigator, and that is not consideration — it is the size of what we can afford.<br/><br/><b>OBJECTIVE</b> Bring the parts to the outpost pad.

  - id: 24
    client: outpost
    payload:
      name: Evacuation Order
      mass: 0.2
    fuel: 365
    start: { x: -16, y: 1110 }
    target: outpost-main
    failDepth: -190
    messages:
      - sender: IXION OUTPOST
        content: >-
          Both charters have hit the same seam from opposite sides. We have recommended evacuation. Nobody has acknowledged it.
      - sender: IXION OUTPOST
        content: >-
          We are aware you fly for them as well, navigator. It has never been held against you. You go where the contract sends you, which is a thing we have in common.<br/><br/><b>OBJECTIVE</b> Bring the order to the outpost pad.

  - id: 25
    client: kessler
    payload:
      name: Deep Lighting Rig
      mass: 1.1
    fuel: 430
    start: { x: 5, y: 1110 }
    target: kessler-deep
    failDepth: -320
    messages:
      - sender: KESSLER DEEP
        content: >-
          We broke into the chasm and the shaft went with it. Three hundred metres down now, and the deck went down with the floor. Below the old ledge line it squeezes and the fog goes black.
      - sender: KESSLER DEEP
        content: >-
          Trust the altimeter, not the optical feed. Down there the two will disagree, and the altimeter will be the one that is right.<br/><br/><b>OBJECTIVE</b> Deliver to KESSLER DEEP.
    adds:
      # The abyss this phase is named for, and the reason `failDepth` drops to -320 here
      # while nothing in the canyon used to reach past -172. The shaft is what opens it.
      digs:
        - id: kessler-shaft
          anchorToWall: east
          mount: floor
          halfWidth: 12
          depth: 303
      props:
        - kind: pad
          corp: kessler
          id: kessler-deep
          col: 30
          row: -23
          x: 60
          # Placeholder — `attachToDig` resolves it to the new floor.
          y: -300
          width: 11
          attachToDig: kessler-shaft
    # The ledge was the working deck for missions 21-23 and is superseded the moment the
    # deep platform opens below it — same rule as mission 21's. `kessler-deep` is the last
    # Kessler destination in the campaign, so the bore holds exactly one deck from here on.
    decommissions:
      - kessler-ledge

  - id: 26
    client: helion
    payload:
      name: Seam Charges
      mass: 1.4
    fuel: 420
    start: { x: 19, y: 1090 }
    target: helion-cavern
    failDepth: -320
    messages:
      - sender: HELION EXTRACTION
        content: >-
          CONTRACT 4471-C · REV 9 · AUTO<br/><br/>ASSET CLASS: REMOTE CARGO / HD-7<br/>CONSIGNMENT: SEAM CHARGES<br/>DESTINATION: HELION CAVERN<br/>ATTRITION: WITHIN TOLERANCE
      - sender: CONDITIONS OF CARRIAGE
        content: >-
          ROUTE NOTE: FULL CANYON CROSSING, THEN LATERAL ENTRY BENEATH THE BRACING.<br/>EVERY SEGMENT OF THIS TRANSIT HAS BEEN FLOWN BEFORE. NO SINGLE CONTRACT HAS COMBINED THEM.<br/>RETURN EXPECTED: NO<br/><br/><b>OBJECTIVE</b> Deliver charges to HELION CAVERN.
      - sender: ANNEX A — ARBITRATION
        content: >-
          PROCEEDINGS CONTINUE. THE CARRIER IS NOT A PARTY.

  - id: 27
    client: kessler
    payload:
      name: Containment Shell
      mass: 1.9
    fuel: 460
    start: { x: -11, y: 1090 }
    target: kessler-deep
    failDepth: -320
    messages:
      - sender: KESSLER DEEP
        content: >-
          Heaviest object anyone has flown in this canyon. West wall to the bottom of the shaft, through everything both charters have built.
      - sender: KESSLER DEEP
        content: >-
          I would not hand this run to anyone else.<br/><br/><b>OBJECTIVE</b> Deliver the shell to KESSLER DEEP.

  - id: 28
    client: outpost
    payload:
      name: Core Archive
      mass: 1.0
    fuel: 390
    start: { x: 20, y: 1070 }
    target: outpost-main
    failDepth: -320
    messages:
      - sender: IXION OUTPOST
        content: >-
          We are shutting down. Everything the outpost learned about this canyon is in that archive — every sounding, every core, the mast calibration, all of it.
      - sender: IXION OUTPOST
        content: >-
          Fly it home one last time, navigator.
      - sender: IXION OUTPOST
        content: >-
          The radar stays up. We are leaving it powered and the charters can use it or not. You will still have your bearings after we are gone, which seemed the least we could do.<br/><br/><b>OBJECTIVE</b> Return the archive to the outpost pad.

  - id: 29
    client: helion
    payload:
      name: Arbitration Writ
      mass: 0.3
    fuel: 350
    start: { x: 0, y: 1070 }
    target: helion-cavern
    failDepth: -320
    messages:
      - sender: HELION EXTRACTION
        content: >-
