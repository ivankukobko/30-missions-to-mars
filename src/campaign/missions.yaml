  - id: 29
    sol: 628
    client: kessler
    # Ixion's key, on a Kessler contract, after the outpost has gone dark. The brief is
    # the reason: mission 2's opening line comes back verbatim over a channel nobody is
    # left to transmit on.
    #
    # **Kessler describes a charge a third of the weight of the one you are carrying.** He
    # says six hundred kilos and the manifest says 1.8 — the heaviest thing anybody has
    # flown here except the containment shell — and nothing in the campaign ever reconciles
    # the two numbers.
    #
    # The discovery is meant to happen in the player's hands, not on a card. After
    # twenty-eight deliveries they know what a light load feels like, and this one will not
    # stop; the brief simply gives them a number to disagree with. Who substituted it is
    # not answered and must not be: Ixion, Kessler himself, or Helion's own `AUTO` system
    # shipping against a wrong field are all supported by what is already written, and the
    # campaign's whole method is to leave that standing.
    #
    # Kessler does not know this is the last of anything — nobody in the canyon does, and
    # the brief has to read that way. He measures the mouth in time rather than in tally
    # ("going on a year down this mouth", not "my Nth run"), which is his own register —
    # see `sol`'s own comment in Missions.ts — and the same reason nothing here states the
    # campaign's own length: that number belongs to the player counting sols, not to a
    # charter who has no way to know the story is about to end.
    #
    # **"navigator" is caused here, and that is a deliberate trade.** An earlier cut had the
    # name arrive uncaused — the one deviation in eleven runs, never explained. It is
    # motivated now: Kessler breaks the charter reticence he kept at mission 26 ("not
    # something I have the time to chase") and says plainly what the quiet on the outpost
    # channel meant. Speaking of the crew as people — once — is what costs him the category
    # noun. The name lands on that card, mid-break, not as a sign-off; the final card is
    # bare. The price paid for it is the "did they leave or did they die" ambiguity.
    musicTrack: outpost
    payload:
      name: Final Charge
      mass: 1.8
    fuel: 445
    start: { x: -18, y: 1070 }
    target: shaft-deep
    failDepth: -320
    messages:
      - sender: KESSLER DEEP
        content: >-
          Going on a year down this mouth and it still is not done with us. Down the hole the outpost started, and every metre under that first stretch you put there yourself.
      - sender: KESSLER DEEP
        content: >-
          Six hundred kilos, same as the cutting charges — you have flown this one before. Nobody else is on the canyon now.
      - sender: KESSLER DEEP
        content: >-
          The outpost did not pull out, navigator. Nobody pulls out of here. I heard their channel go quiet — one at a time, until there was nobody left keying it. So it is you, me, and three hundred metres of—
      - sender: IXION OUTPOST
        content: >-
          We are the only thing at the bottom of this canyon, and we intend to stay that way.
      - sender: KESSLER DEEP
        content: >-
          —of hole. Take it down.<br/><br/><b>OBJECTIVE</b> Deliver the charge to SHAFT DEEP.

# ---------------------------------------------------------------------------- epilogue
#
# What arrives after the twenty-ninth delivery, before the campaign screen — the
# campaign's own thirtieth flight, though `MISSION_COUNT` does not count it: no client,
# no target, no score, so it was never one of the missions proper. See `EPILOGUE`'s own
# comment in Missions.ts.
#
# The delivery is confirmed on the first card, deliberately and before anything else —
# the player has to know they succeeded before the ground moves, or the whole sequence
# reads as a crash.
#
# Kessler is cut off mid-sentence, which is the second time in two briefs. In mission 29
# a card lands on the channel between his two halves and he carries the sentence straight
# across it — no acknowledgement, no "say again", nothing. Here there is no second half.
#
# Nobody narrates. The console reports what it can no longer hear, and Helion files the
# outcome because Helion is the only party with nobody to evacuate. `SUSTAINED` is the
# legal word for a warning upheld, arriving from a system with no opinion about it, a
# year after everyone who filed it left the planet.
epilogue:
  - sender: KESSLER DEEP
    content: >-
      Charge is seated, navigator. Never lost one with you yet.<br/><br/>Pulling my crew up now. Give me twenty minutes and I will—
  - sender: UPLINK
    register: sys
    content: >-
      Vehicle telemetry: lost.<br/>Mast bearing: lost.<br/><br/>Nothing is answering on this channel.
  - sender: HELION EXTRACTION
    content: >-
      CONTRACT 4471-C · REV 12 · AUTO<br/><br/>SITE STATUS: INACCESSIBLE<br/>HAZARD FILING IXN-0114: SUSTAINED<br/>ARBITRATION: MOOT<br/>CARRIER: CLASSIFICATION PENDING
