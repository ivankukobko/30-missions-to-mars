# 30 Missions to Mars - Campaign Specification
#
# Structure only. Every word the player reads — briefs, radio, debriefs, payload
# names, the epilogue — lives in src/locales/en.yaml and its translations, laid over
# this file by mission id and entry index. See docs/localisation.md.

missions:
  # ---------------------------------------------------------------------------- 1
  #
  # The flight that makes every other flight possible, and the only silent one.
  #
  # `messages` is empty and that is the design, not an omission: nobody can transmit to
  # you before the link exists. No brief, no sender, no card, no music — and no `radio`
  # either, for the same reason: a call would be the one transmission in the campaign that
  # arrives before the relay carrying it.
  #
  # It has a debrief — in src/locales/en.yaml, like every word — and that is where the
  # campaign's first voice now is. Ixion speaks on
  # this mission's own score card, because the relay is standing on the rim by then and the
  # channel exists — the voice arrives *as a consequence of this landing* rather than one
  # loading screen later at the top of mission 2, which is where it used to sit and where
  # nothing caused it.
  #
  # One control. `AIRFRAMES.relay` locks rotation and carries no lateral thruster, so the
  # only input is when to burn and the only thing it decides is how hard you arrive. An
  # earlier version drifted sideways so that one control decided two things, and it is
  # unlandable: `resolveContact` tests total speed, and a vehicle that cannot rotate can
  # never null a sideways velocity. See `PROLOGUE`'s note in Missions.ts.
  #
  # `start.x` below is nominal and is not what the vehicle enters at. Having no lateral
  # control means the entry column *is* the landing site, so it is resolved against the
  # canyon — `entryX` in Missions.ts, over the bench `RIM_BENCH` grades into the east lip.
  # The rim stands anywhere from x=122 to x=183 depending on the seed, so an authored
  # column is a coin toss, and it was losing about a third of the time.
  #
  # `target: null` because there is no address, because there is nobody to have given you
  # one. Any survivable touchdown completes it.
  - id: 1
    sol: 0
    client: outpost
    payload:
      mass: 0
      shape: crate
    fuel: 300
    start: { x: 150, y: 1020 }
    target: null
    failDepth: -60
    airframe: relay
    colonyBudget:
      outpost: 10
    messages: []

  - id: 2
    sol: 6
    client: outpost
