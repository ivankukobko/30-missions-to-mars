    # The reason to remove rather than correct them: **the intention is to bind shaft depth
    # to the colony budget**, so a campaign flown well digs deeper than one scraped through.
    # The moment depth is earned rather than authored, every metre figure in a brief is a
    # claim the campaign cannot keep. Kessler measures in felt time rather than tally
