services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 30-missions-to-mars
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: npm run dev -- --host
