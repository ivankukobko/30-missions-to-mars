name: Publish

# Builds the Vite bundle once and publishes it to GitHub Pages and, when configured, to
# itch.io. `vite.config.ts` sets `base: './'`, so the same `dist/` works at the Pages
# project-page subpath *and* under the random per-game path itch serves an HTML5 build
# from, without either one hardcoding where it is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gates: the campaign's determinism and geometry invariants live in the suite,
      # so a red test must not ship. Drop the typecheck line if CI ever hits the
      # host-only `tsc` quirk documented in CLAUDE.md (it should not — `npm ci` here
      # is a clean install on node 24, the same as the container).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # The same bytes a second time as an ordinary artifact. The Pages one is a tarball
      # in a shape only `deploy-pages` reads, and building again in the itch job would
      # mean the storefront and the web build were never proven to be the same bundle.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Publishing the browser build to itch.io.
  #
  # Inert until `ITCH_TARGET` is set as a repository *variable* (Settings → Secrets and
  # variables → Actions → Variables) to `user/game` — the slug from the game's itch URL,
  # not its title — and `BUTLER_API_KEY` as a *secret* from https://itch.io/user/settings/api-keys.
  # A variable rather than a secret because the target is not one: masking it would only
  # make a failed push unreadable in the log.
  #
  # The channel name is what itch reads platform from, and `html5` marks a browser build.
  # The "This file will be played in the browser" checkbox is set once, by hand, on the
  # game's edit page after the first push — butler has no flag for it and cannot.
  #
  # Desktop channels (`windows`, `osx`, `linux`) belong here too once there is a desktop
  # shell to build; today `dist/` is the only artifact there is.
  itch:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ITCH_TARGET != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Fetch butler
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
      - name: Push the browser build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # The run number rides along because every push to main is a build, while the
          # package version only moves on a release — without it itch would show a column
          # of identical version strings and no way to tell which one is on the page.
          version="$(node -p "require('./package.json').version")-${{ github.run_number }}"
          ./butler push dist "${{ vars.ITCH_TARGET }}:html5" --userversion "$version"
          ./butler status "${{ vars.ITCH_TARGET }}:html5"
