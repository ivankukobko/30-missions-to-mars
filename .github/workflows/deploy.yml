name: Deploy to GitHub Pages

# Builds the Vite bundle and publishes it to Pages on every push to main.
# `vite.config.ts` sets `base: './'`, so the same `dist/` works at the project-page
# subpath without hardcoding the repo name.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gates: the campaign's determinism and geometry invariants live in the suite,
      # so a red test must not ship. Drop the typecheck line if CI ever hits the
      # host-only `tsc` quirk documented in CLAUDE.md (it should not — `npm ci` here
      # is a clean install on node 20).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
